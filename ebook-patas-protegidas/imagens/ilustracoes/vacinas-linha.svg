<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 520 210' width='520' height='210' font-family='Nunito Sans, sans-serif'><line x1='30' y1='90' x2='500' y2='90' stroke='#a9cbb0' stroke-width='6' stroke-linecap='round'/><circle cx='45' cy='90' r='13' fill='#2f6b52' stroke='#fff' stroke-width='3'/><rect x='-1' y='34' width='92' height='22' rx='11' fill='#2f6b52'/><text x='45' y='49' font-size='9.5' fill='#fff' font-weight='800' text-anchor='middle' >6–8 sem.</text><text x='45' y='124.0' font-size='10' fill='#22302a' font-weight='700' text-anchor='middle' >1ª dose</text><text x='45' y='136.5' font-size='10' fill='#22302a' font-weight='700' text-anchor='middle' >da série</text><circle cx='140' cy='90' r='13' fill='#2f6b52' stroke='#fff' stroke-width='3'/><rect x='94' y='34' width='92' height='22' rx='11' fill='#2f6b52'/><text x='140' y='49' font-size='9.5' fill='#fff' font-weight='800' text-anchor='middle' >a cada 2–4 sem.</text><text x='140' y='124.0' font-size='10' fill='#22302a' font-weight='700' text-anchor='middle' >Doses</text><text x='140' y='136.5' font-size='10' fill='#22302a' font-weight='700' text-anchor='middle' >repetidas</text><circle cx='240' cy='90' r='13' fill='#e48a45' stroke='#fff' stroke-width='3'/><rect x='194' y='34' width='92' height='22' rx='11' fill='#e48a45'/><text x='240' y='49' font-size='9.5' fill='#fff' font-weight='800' text-anchor='middle' >16 sem. ou +</text><text x='240' y='124.0' font-size='10' fill='#22302a' font-weight='700' text-anchor='middle' >Última dose</text><text x='240' y='136.5' font-size='10' fill='#22302a' font-weight='700' text-anchor='middle' >da série inicial</text><circle cx='345' cy='90' r='13' fill='#e48a45' stroke='#fff' stroke-width='3'/><rect x='299' y='34' width='92' height='22' rx='11' fill='#e48a45'/><text x='345' y='49' font-size='9.5' fill='#fff' font-weight='800' text-anchor='middle' >26 sem. ou +</text><text x='345' y='124.0' font-size='10' fill='#22302a' font-weight='700' text-anchor='middle' >Revacinação</text><text x='345' y='136.5' font-size='10' fill='#22302a' font-weight='700' text-anchor='middle' >(reforço)</text><circle cx='455' cy='90' r='13' fill='#1d4a39' stroke='#fff' stroke-width='3'/><rect x='409' y='34' width='92' height='22' rx='11' fill='#1d4a39'/><text x='455' y='49' font-size='9.5' fill='#fff' font-weight='800' text-anchor='middle' >Depois</text><text x='455' y='124.0' font-size='10' fill='#22302a' font-weight='700' text-anchor='middle' >Reforços nos</text><text x='455' y='136.5' font-size='10' fill='#22302a' font-weight='700' text-anchor='middle' >intervalos do vet</text><text x='260.0' y='178' font-size='9.2' fill='#55645c' font-weight='600' text-anchor='middle' >Referência: diretrizes de vacinação da WSAVA (2024). O calendário do seu cão</text><text x='260.0' y='192' font-size='9.2' fill='#55645c' font-weight='600' text-anchor='middle' >deve ser definido pelo médico-veterinário, conforme região, risco e vacina utilizada.</text></svg>