<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 520 190' width='520' height='190' font-family='Nunito Sans, sans-serif'><rect width='520' height='190' rx='12' fill='#f5eee2'/><g transform='translate(60,40)'><path d='M0 40 q0 -40 40 -40 q70 0 110 50 q-20 -6 -40 -6 h-110 z' fill='#f2ece4' stroke='#d8c6a8' stroke-width='2'/><path d='M4 38 q2 -28 34 -30 q30 0 46 22 q-14 8 -40 10 z' fill='#f2a7a7'/><rect x='-40' y='0' width='44' height='46' rx='10' fill='#d9a066'/><line x1='108' y1='-6' x2='100' y2='56' stroke='#c0392b' stroke-width='2.4' stroke-dasharray='5 4'/></g><g transform='translate(320,40)'><path d='M0 40 q0 -40 40 -40 q70 0 110 50 q-20 -6 -40 -6 h-110 z' fill='#3a3a3a' stroke='#22302a' stroke-width='2'/><rect x='-40' y='0' width='44' height='46' rx='10' fill='#d9a066'/><line x1='112' y1='-6' x2='104' y2='56' stroke='#c0392b' stroke-width='2.4' stroke-dasharray='5 4'/></g><text x='140' y='130' font-size='10.5' fill='#1d4a39' font-weight='800' text-anchor='middle' >Unha clara: o sabugo (rosado)</text><text x='140' y='145' font-size='10.5' fill='#1d4a39' font-weight='800' text-anchor='middle' >é visível. Corte só a ponta.</text><text x='395' y='130' font-size='10.5' fill='#1d4a39' font-weight='800' text-anchor='middle' >Unha escura: o sabugo não aparece.</text><text x='395' y='145' font-size='10.5' fill='#1d4a39' font-weight='800' text-anchor='middle' >Corte pouquinho por vez.</text><text x='260.0' y='176' font-size='9.6' fill='#55645c' font-weight='600' text-anchor='middle' >A linha tracejada vermelha mostra a região segura de corte, longe do sabugo.</text></svg>