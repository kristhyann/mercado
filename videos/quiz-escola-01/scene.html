const $ = id => document.getElementById(id);

const win = (t, a, b) => t >= a && t < b;
const EV = []; const ev = (t, type) => EV.push({ t: +t.toFixed(3), type });
ev(.05, 'whoosh'); ev(.4, 'clang'); ev(PL.rule, 'pop');

// opções HTML
const optsEl = $('opts'); for (let i = 0; i < 4; i++) { const d = document.createElement('div'); d.className = 'op'; d.innerHTML = `<i>${'ABCD'[i]}</i><span></span><b></b>`; optsEl.appendChild(d); }
let lastQ = -1;
function setQ(i) { if (i === lastQ) return; lastQ = i; const [q, o] = QZ[i]; $('qtext').textContent = q; $('qtext').style.fontSize = q.length > 44 ? '48px' : q.length > 34 ? '54px' : '60px'; [...optsEl.children].forEach((d, j) => d.style.fontSize = o[j].length > 17 ? '44px' : '54px'); [...optsEl.children].forEach((d, j) => { d.querySelector('span').textContent = o[j]; });
  $('qn').textContent = `PERGUNTA ${i + 1}/10`; const [lt, lc] = LV(i); $('lvl').textContent = lt; $('lvl').style.background = lc; }
const TITLE_CAM = t => { const a = .22 - t * .09; return [V(Math.sin(a) * 7.0, 2.5 + t * .05, Math.cos(a) * 7.0), V(0, 2.35, 0)]; };

window.draw = function (t) {
  // estado
  const Q = PL.q; let qi = -1; for (let i = 0; i < Q.length; i++) if (t >= Q[i].start) qi = i;
  const inFinal = t >= PL.final; if (inFinal) qi = -1;
  const inTitle = t < 3.0, inRule = win(t, 3.0, Q[0].start);
  // cena 3D
  cube.rotation.set(t * .6, t * .9, .2); cube.position.copy(CUBE); cube.position.y += Math.sin(t * 2) * .06; cubeGlow.position.copy(cube.position); cubeGlow.rotation.set(Math.PI / 2 + Math.sin(t) * .3, 0, t);
  neonBars.forEach((b, i) => b.material.emissiveIntensity = 1.0 + .8 * Math.max(0, Math.sin(t * 4 + i)));
  ring1.material.emissiveIntensity = 1.2 + Math.sin(t * 3) * .4;

  titleG.visible = inTitle || t > PL.end - .7; cube.visible = true; cubeGlow.visible = true;
  let cp, tg;
  if (titleG.visible) { const tt = t > PL.end - .7 ? (t - PL.end) : t; const s = t > PL.end - .7 ? ease((t - PL.end + .7) / .7) : 1;
    [tQuiz, tSub, tOne].forEach((g, j) => { const k = t > PL.end - .7 ? s : 1; g.scale.setScalar(Math.max(.001, k)); g.rotation.y = Math.sin(t * 1.3 + j) * .08; });
    [cp, tg] = TITLE_CAM(Math.max(0, tt + (t > PL.end - .7 ? 0 : 0))); if (t > PL.end - .7) { const fc = [V(.6, 2.3, 5.4), V(0, 2.1, 0)]; const u = ease((t - PL.end + .7) / .7); [cp, tg] = [fc[0].lerp(TITLE_CAM(0)[0], u), fc[1].lerp(TITLE_CAM(0)[1], u)]; } }
  else if (inRule) { const k = t - PL.rule; cp = V(Math.sin(t * .2) * 1.2, 2.6, 5.6); tg = V(0, 2.4, 0); }
  else if (qi >= 0) { const q = Q[qi]; setQ(qi); const k = t - q.start; const ic = icons[qi]; ic.visible = true;
    const inS = easeOut(clamp(k / .45)); const out = t > q.next - .3 ? ease((t - q.next + .3) / .3) : 0; ic.position.set(lerp(-2.5, ICON_X, inS) + out * 2.5, ICON_Y + Math.sin(t * 2) * .05, ICON_Z); ic.rotation.y = Math.sin(t * 1.4) * .4 + (1 - inS) * 2; ic.scale.setScalar(ICON_S[qi]);
    if (ic.userData.spin) ic.userData.spin.rotation.y = t * .8; if (ic.userData.siren) ic.userData.siren.material.emissiveIntensity = Math.sin(t * 12) > 0 ? 2 : .2; if (ic.userData.flames) ic.userData.flames.forEach((f, j) => f.scale.y = 1 + Math.sin(t * 14 + j * 2) * .2); if (ic.userData.water) ic.userData.water.scale.x = ic.userData.water.scale.z = 1 + Math.sin(t * 20) * .1; if (ic.userData.lens) ic.userData.lens.position.x = .3 + Math.sin(t * 1.5) * .15;
    if (ic.userData.flag) { const pa = ic.userData.flag.geometry.attributes.position, b = ic.userData.base; for (let v = 0; v < pa.count; v++) { const x = b[v * 3]; pa.array[v * 3 + 2] = Math.sin(x * 6 + t * 5) * .05 * (x + .5); } pa.needsUpdate = true; }
    const timing = win(t, q.timer, q.reveal); if (timing) { sw.visible = true; const r = q.reveal - t; const v = Math.ceil(r); paintSW(Math.max(1, v), r / 3); sw.position.copy(CUBE); sw.position.z += .5; sw.scale.setScalar(1.05 * pop(t - q.timer, .25) * (1 + Math.max(0, .12 - ((q.reveal - t) % 1)) * 1.5)); cube.visible = false; cubeGlow.visible = false; sw.rotation.set(0, .3, Math.sin(t * 14) * .04); }
    const rev = t >= q.reveal; if (rev) { okL.intensity = 30 * (1 - clamp((t - q.reveal) / 1.2) * .5); ic.scale.setScalar(ICON_S[qi] * (1 + .15 * pop(t - q.reveal, .3) * (t - q.reveal < .3 ? 1 : 0))); }
    cp = V(Math.sin(t * .25) * .4, 2.35, rev ? lerp(5.6, 5.2, easeOut(clamp((t - q.reveal) / .5))) : 5.6); tg = V(0, 2.1, 0); }
  else { const k = t - PL.final; cp = V(Math.sin(t * .3) * .6, 2.4, 5.8 - Math.min(k, 4) * .08); tg = V(0, 2.2, 0); }
  cam.position.copy(cp); cam.lookAt(tg); cam.updateProjectionMatrix(); cam.updateMatrixWorld(true);

  const cardIn = showQ ? easeOut(clamp((t - q.start) / .35)) * (1 - ease(clamp((t - q.next + .3) / .3))) : 0;
  $('top').style.opacity = showQ ? 1 : 0; $('top').style.transform = 'none';
  $('qcard').style.opacity = cardIn > 0 ? 1 : 0; $('qcard').style.transform = `translateX(${(1 - cardIn) * -1100}px)`;
  $('opts').style.opacity = cardIn > 0 ? 1 : 0; $('opts').style.transform = 'none';
  if (showQ) { [...optsEl.children].forEach((d, j) => { const k = easeOut(clamp((t - q.start - .15 - j * .07) / .3)) * (1 - ease(clamp((t - q.next + .3 - j * .03) / .3))); d.style.transform = `translateX(${(1 - k) * 1100}px)`;
      const rev = t >= q.reveal, ok = j === QZ[qi][2]; d.className = 'op' + (rev ? (ok ? ' ok' : ' no') : ''); d.querySelector('b').textContent = rev ? (ok ? '✅' : '❌') : ''; if (rev && ok) d.style.transform += ` scale(${1 + .06 * pop(t - q.reveal, .3)})`; }); }
  { const el = $('ans'); const on = showQ && t >= q.reveal && t < q.next - .2; if (on) { el.textContent = '✅ ' + QZ[qi][3]; el.style.fontSize = QZ[qi][3].length > 12 ? '68px' : '96px'; place(el, true, 480, 720, pop(t - q.reveal, .3), -3); } else el.style.opacity = 0; }
  { const el = $('note'); const on = showQ && t >= q.reveal + .1 && t < q.next - .15; let txt = ''; if (on) { const left = q.next - t; txt = left > 2.2 ? (t < q.reveal + 2.6 ? '💡 ' + NOTE[qi] : '✅ Acertou? +1 ponto!') : (qi < 9 ? '⏭️ Próxima em ' + Math.ceil(left) + '…' : '🏁 Resultado em ' + Math.ceil(left) + '…'); } el.querySelector('div').textContent = txt; fixed(el, on ? pop(t - q.reveal - .1, .3) : 0); }

  let wTxt = null, wSt = 0;
  for (const w2 of ALL) if (t >= w2.start - .03 && t < w2.end + .15) { wTxt = w2.w; wSt = w2.start; }
  const capOn = wTxt && (inRule || inFinal) && t < PL.end - .7;
  const cap2 = $('cap'); if (capOn) { cap2.textContent = wTxt.toUpperCase().replace(/[.,!?:…"“”]/g, ''); cap2.className = 'o stroke hl'; const k = t - wSt; fixed(cap2, k < .06 ? lerp(.75, 1.1, clamp(k / .06)) : k < .12 ? lerp(1.1, 1, (k - .06) / .06) : 1); } else fixed(cap2, 0);
  renderer.render(scene, cam); return 1;
};
