  bubbles.forEach((b, i) => { const on = snork.visible; b.visible = on; if (!on) return; snork.localToWorld(tmp.set(0, .12, 0)); const u = ((t * .9 + i / 5) % 1); b.position.copy(tmp).add(V(0, u * .3, Math.sin(i + t) * .03)); b.scale.setScalar(.6 + u); b.material.opacity = (1 - u) * .8; });
  // língua
  const flick = !win(t, S(3), S(16)) && Math.sin(t * 3) > .3; tongue.visible = flick; tongue.scale.set(1 + Math.sin(t * 25) * .3, 1, 1);
  // olhos: lente transparente aparece
  eyes.forEach(e => { e.lens.material.opacity = win(t, T_PALP - .2, S(20)) ? .55 : 0; e.lens.scale.setScalar(win(t, T_PALP - .2, S(20)) ? 1 + .05 * Math.sin(t * 6) : 1); });
  // placa de hospital

  // ---------- textos ----------
  fixed($('hook'), t < T_CALMA ? pop(t - .05, .35) * (1 - clamp((t - T_CALMA + .2) / .2)) : 0);
  const lb = [...LBL].reverse().find(l => t >= l[0]); const lbOn = lb && t < S(20);
  if (lbOn) { $('label').firstElementChild.textContent = lb[1]; fixed($('label'), pop(t - lb[0], .3)); } else fixed($('label'), 0);
  const t1 = $('t1'), t2 = $('t2'), t3 = $('t3'); [t1, t2, t3].forEach(e => e.style.opacity = 0);
  const tag = (el, txt, cls, on, x, y, t0, rot = -4) => { if (!on) return; el.textContent = txt; el.className = 'o tag ' + cls; place(el, true, x, y, pop(t - t0, .3), rot); };
  tag(t1, 'VOCÊ É UMA COBRA', 'green', win(t, T_COBRA, S(3)), 540, 560, T_COBRA, -3);
  tag(t1, 'NÃO DESLOCA', 'red', win(t, T_DESL, S(5)), 540, 600, T_DESL, -4);
  tag(t1, 'ELÁSTICO', '', win(t, T_ELAST, S(6)), 540, 600, T_ELAST, -4);
  tag(t1, 'UM LADO DE CADA VEZ', 'blue', win(t, S(6) + .4, S(7)), 540, 600, S(6) + .4, -3);
  tag(t1, 'TIPO SNORKEL', 'blue', win(t, T_TUBO, S(8)), 540, 600, T_TUBO, -4);
  tag(t1, 'OCAS = AGULHA', '', win(t, T_OCAS, S(10)), 540, 600, T_OCAS, -4);
  tag(t1, 'DOBRAM', 'blue', win(t, T_DOBRAM, S(11)), 540, 600, T_DOBRAM, -4);
  tag(t1, 'NASCE OUTRA', 'green', win(t, T_NASCE, S(12)), 540, 600, T_NASCE, -4);
  tag(t1, 'SALIVA MODIFICADA', '', win(t, T_SALIVA, S(14)), 540, 600, T_SALIVA, -3);
  tag(t1, 'PARALISA', 'red', win(t, T_PARALISA, T_DIGEST), 540, 600, T_PARALISA, -4);
  tag(t1, 'JÁ COMEÇA A DIGESTÃO', 'blue', win(t, T_DIGEST, S(15)), 540, 600, T_DIGEST, -3);
  tag(t1, 'HOSPITAL NA HORA', 'green', win(t, T_HOSP, S(16)), 540, 560, T_HOSP, -3);
  tag(t2, '✕ TORNIQUETE', 'red', win(t, T_TORN, S(16)), 540, 690, T_TORN, 4);
  tag(t3, '✕ CHUPAR O VENENO', 'red', win(t, T_CHUPAR, S(16)), 540, 820, T_CHUPAR, -4);
  tag(t1, 'SECAS, TIPO UNHA', '', win(t, T_SECAS, S(18)), 540, 600, T_SECAS, -4);
  tag(t1, 'BARRIGA AGARRA O CHÃO', 'blue', win(t, T_BARRIGA, S(19)), 540, 600, T_BARRIGA, -3);
  tag(t1, 'SEM PÁLPEBRA', 'red', win(t, T_PALP, T_OLHO), 540, 600, T_PALP, -4);
  tag(t1, 'DORME DE OLHO ABERTO', 'blue', win(t, T_OLHO, S(20)), 540, 600, T_OLHO, -3);
  tag(t1, 'PELE VELHA', '', win(t, T_PELE + .3, 99), 380, 700, T_PELE + .3, -5);
  const cm = $('comic');
  if (win(t, T_CALMA, T_CALMA + 1.6)) { cm.textContent = 'CALMA!'; place(cm, true, 540, 600, pop(t - T_CALMA, .25), -6); }
  else if (win(t, T_PUXA + 2.8, T_PUXA + 3.8)) { cm.textContent = 'GLUP!'; place(cm, true, 560, 600, pop(t - T_PUXA - 2.8, .25), 6); }
  else cm.style.opacity = 0;
  fixed($('final'), t >= S(21) + .4 ? pop(t - S(21) - .4, .35) : 0);
  $('wm').style.opacity = .8;
  // legenda
  let wTxt = null, wSt = 0;
  for (let i = 0; i < SN.length - 1; i++) for (const w2 of SN[i].words) if (t >= w2.start - .03 && t < w2.end + .2) { wTxt = w2.w; wSt = w2.start; }
  const cap = $('cap');
  if (wTxt && t > T_CALMA - .1) { cap.textContent = wTxt.toUpperCase().replace(/[.,!?:]/g, ''); cap.className = 'o stroke' + (HL.test(wTxt) ? ' hl' : ''); const k = t - wSt; fixed(cap, k < .06 ? lerp(.75, 1.1, clamp(k / .06)) : k < .12 ? lerp(1.1, 1, (k - .06) / .06) : 1); } else fixed(cap, 0);
  renderer.render(scene, cam); return 1;
};
