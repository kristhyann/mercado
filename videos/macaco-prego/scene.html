  const bOn = win(t, S(1) - .05, S(2) + .2); const bs = pop(t - S(1) + .05, .3) * (1 - clamp((t - S(2) - .05) / .15));
  show($('balloon'), bOn && bs > 0, clamp(hp.x + 260, 340, 740), Math.max(hp.y - 190, 360), bs, -3);
  // etiqueta da etapa
  const st = STEPS.find(s => t >= S(s.from) && t < S(s.to));
  if (st) { const l = $('label'); const sp = l.firstElementChild; sp.style.background = st.col; sp.children[0].textContent = st.n; sp.children[1].textContent = st.txt; showFixed(l, pop(t - S(st.from), .32)); } else showFixed($('label'), 0);
  // censurado

  show($('censor'), win(t, S(5), S(7)), cp.x, cp.y, pop(t - S(5), .25), -7);
  // +1 KG

  show($('kg'), win(t, S(13) + .45, S(15)), kp.x, kp.y - 20, pop(t - S(13) - .45, .3) * (1 + .05 * Math.sin(t * 8)), 5);
  // X vermelho (duro demais)
  mk.head.getWorldPosition(tmpA); const xp = scr(tmpA.clone().add(v3(.75, .1, .2)));
  show($('xmark'), win(t, S(12) + .9, S(13)), xp.x, xp.y, pop(t - S(12) - .9, .25), -8);
  // CRACK
  const crp = scr(ANVIL_TOP.clone().add(v3(0, 1.3, 0)));
  show($('crack'), win(t, T_IMPACT, T_IMPACT + 1.1), crp.x, Math.min(crp.y, 700), pop(t - T_IMPACT, .25) * (1 + .04 * Math.sin(t * 20)), -8);
  // 3.000 anos
  const bp = pop(t - S(23) - .25, .35); showFixed($('b3000'), win(t, S(23), S(24)) ? bp : 0, 1, 0);
  // gerações
  const gk = clamp((t - S(24) - .1) / Math.max(.8, (E(24) - S(24) - .3))); $('genn').textContent = Math.round(ease(gk) * 450);
  showFixed($('gen'), win(t, S(24), S(25)) ? pop(t - S(24), .3) : 0);
  showFixed($('africa'), win(t, S(25), S(26)) ? pop(t - S(25) - .1, .35) : 0);
  // final
  showFixed($('final'), t >= S(28) ? pop(t - S(28), .35) : 0);
  // legenda palavra por palavra
  let wTxt = null, wSt = 0;
  for (let i = 1; i < SN.length - 1; i++) for (const w of SN[i].words) if (t >= w.start - .03 && t < w.end + .25) { wTxt = w.w; wSt = w.start; }
  // não mostrar se já começou a próxima palavra
  const cap = $('cap');
  if (wTxt) { cap.textContent = wTxt.toUpperCase().replace(/[.,!?]/g, ''); cap.className = 'o stroke' + (HL.test(wTxt) ? ' hl' : ''); showFixed(cap, (t - wSt < .06 ? lerp(.75, 1.1, clamp((t - wSt) / .06)) : t - wSt < .12 ? lerp(1.1, 1, (t - wSt - .06) / .06) : 1)); }
  else showFixed(cap, 0);

  renderer.render(scene, cam);
  return 1;
};
window.EVENTS = EV; window.POSES = POSES;

window.ready = true;
