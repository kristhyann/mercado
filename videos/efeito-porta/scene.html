  // 2 efeito da porta (perto, cozinha)
  [T_PESQ - .1, (t, k) => { world('house'); me.root.position.copy(P_KIT); me.root.rotation.y = .3; poseP(me, PP.think, 0, t); face(me, 'neutral', t); setBulb(false, t); setQ(true, t); door.rotation.y = 1.6 - ease((t - T_EFEITO) / .5) * 1.5;
    return [V(1.0, 4.4, 1.2), V(-.2, 1.1, -1.8)]; }],
  // 3 gráfico: passou pela porta esquece mais
  [T_EXP - .1, (t, k) => { world('chart'); const a = ease(clamp((t - T_EXP) / 1.2)), b = ease(clamp((t - T_PORTA2 + .3) / 1.4)); barA.scale.y = Math.max(.001, .9 * a); barA.position.y = .9 * a / 2; barB.scale.y = Math.max(.001, 1.9 * b); barB.position.y = 1.9 * b / 2;
    brainEmo.position.set(.6, 1.9 * b + .35, 0); brainEmo.visible = b > .9; return [V(0, 1.9, 6.6), V(0, 1.15, 0)]; }],
  // 4 cérebro organiza a memória em episódios (cenas de filme)
  [T_UMA - .1, (t, k) => { world('mind'); brain.rotation.y = t * .4; mDoor.visible = false; lockS.visible = false; cardCookie.visible = false; clap.visible = t > T_CENAS - .2; clap.position.set(.75, 3.2, -.3); clap.scale.setScalar(.5 * pop(t - T_CENAS + .2, .3));
    [cardSala, cardCoz].forEach((c, i) => { const s = pop(t - T_EPIS + .2 - i * .3, .35); c.visible = s > 0; c.scale.setScalar(Math.max(.001, s)); c.position.set(-.6 + i * 1.2, 1.0, 0); c.rotation.set(0, (i ? -1 : 1) * .2, 0); }); return [V(0, 1.9, 5.8), V(0, 1.5, 0)]; }],
  // 5 a porta como fim de cena: fecha o capítulo, abre um novo
  [T_APORTA - .1, (t, k) => { world('mind'); brain.rotation.y = t * .4; clap.visible = false; lockS.visible = false; mDoor.visible = true; mDoor.position.set(0, .15, -.4);
    const cl = ease(clamp((t - T_FECHA) / .5)), op = ease(clamp((t - T_ABRE) / .6)); mLeaf.rotation.y = -1.5 * (1 - cl) + (-1.5 * op); cardSala.visible = true; cardSala.position.set(lerp(-.75, -1.15, cl), 1.0, lerp(.2, -.6, cl)); cardSala.scale.setScalar(lerp(1, .65, cl)); cardSala.rotation.set(0, .3, 0);
    cardCoz.visible = op > 0; cardCoz.position.set(lerp(0, .75, op), 1.0, lerp(-.5, .3, op)); cardCoz.scale.setScalar(Math.max(.001, lerp(.4, 1, op))); cardCoz.rotation.set(0, lerp(0, -.2, op), 0); cardCookie.visible = true; cardCookie.position.copy(cardSala.position).add(V(0, .75 * cardSala.scale.x, .05));
    return [V(.0, 1.8, 5.8), V(0, 1.3, 0)]; }],
  // 6 a intenção fica no episódio que acabou → difícil de acessar
  [T_INT - .1, (t, k) => { world('mind'); brain.rotation.y = t * .3; clap.visible = false; mDoor.visible = true; mDoor.position.set(0, .15, -.4); mLeaf.rotation.y = 0; cardSala.visible = true; cardSala.position.set(-1.0, 1.0, -.9); cardSala.scale.setScalar(.65); cardSala.rotation.set(0, .3, 0);
    cardCoz.visible = true; cardCoz.position.set(.95, 1.0, .5); cardCoz.scale.setScalar(.85); cardCookie.visible = true; cardCookie.position.set(-1.0, 1.0, -.82); cardCookie.scale.setScalar(.3); lockS.visible = t > T_ACABOU - .2; lockS.position.set(-.75, .7, -.75); lockS.scale.setScalar(.32 * pop(t - T_ACABOU + .2, .3));

  // 8 não é falta de memória: cérebro organizando por cenas
  [T_NAOE - .1, (t, k) => { world('house'); me.root.position.copy(P_SOFA); me.root.rotation.y = .2; poseP(me, { ...PP.stand, rx: -2.6, rz: -.3, re: -.3 }); face(me, 'happy', t); setBulb(true, t); setThought(true, t); return [V(-.6, 1.8, 5.8), V(-1.3, 1.5, 2.7)]; }],
  // 9 dica: repita em voz alta enquanto anda
  [T_DICA - .3, (t, k) => { world('house'); const w = walkPath(t, T_DICA, T_COMENTA - .2); me.root.position.copy(w.p); me.root.rotation.y = w.ry; poseP(me, PP.stand, w.u > 0 && w.u < 1 ? 1 : 0, t); face(me, t > T_REPITA ? 'talk' : 'happy', t); setBulb(true, t); setThought(true, t); door.rotation.y = 1.6;

  // 10 CTA: porta abrindo
  [T_COMENTA - .1, (t, k) => { world('house'); me.root.position.copy(P_KIT); me.root.rotation.y = 0; poseP(me, { ...PP.stand, rx: -2.8, rz: -.4, re: -.3 }); face(me, 'happy', t); setBulb(true, t); door.rotation.y = 1.6 * ease((t - T_COMENTA) / .8);
    return [V(1.6, 4.4, 5.6), V(0, 1.0, -.9)]; }],
];
window.draw = function (t) {
  let i = 0; while (i + 1 < SHOTS.length && SHOTS[i + 1][0] <= t) i++;
  const [cp, tg] = SHOTS[i][1](t, t - SHOTS[i][0]);
  const off = chart.visible ? chart.position : mind.visible ? mind.position : V(0, 0, 0); cp.add(off); tg.add(off);
  cp.x += Math.sin(t * .35) * .012; cp.y += Math.sin(t * .27) * .008;

  sun.position.copy(tg).add(V(2.5, 6, 4)); sun.target.position.copy(tg);

  const tg2 = [$('t1'), $('t2')]; tg2.forEach(e => e.style.opacity = 0);

  tag(tg2[0], '🚪 EFEITO DA PORTA', '', win(t, T_EFEITO - .1, T_EXP - .1), 540, 300, T_EFEITO - .1, -3);
  tag(tg2[0], '🔬 EXPERIMENTOS', 'purple', win(t, T_EXP, T_UMA - .1), 540, 330, T_EXP, 3);
  tag(tg2[0], '🎬 MEMÓRIA EM EPISÓDIOS', 'white small', win(t, T_EPIS - .2, T_APORTA - .1), 540, 420, T_EPIS - .2, -3);
  tag(tg2[0], '🚪 = FIM DE CENA', '', win(t, T_APORTA, T_INT - .1), 540, 420, T_APORTA, 3);
  tag(tg2[0], '🔒 FICOU NA CENA ANTERIOR', 'red small', win(t, T_ACABOU - .2, T_POR - .1), 540, 420, T_ACABOU - .2, -3);
  tag(tg2[0], '🔙 VOLTE AO LUGAR DA IDEIA', 'green small', win(t, T_VOLTAR - .1, T_NAOE - .1), 540, 420, T_VOLTAR - .1, 3);
  tag(tg2[0], '🧠 NÃO É FALTA DE MEMÓRIA', 'white small', win(t, T_NAOE, T_DICA - .3), 540, 420, T_NAOE, -3);
  tag(tg2[0], '🗣️ REPITA EM VOZ ALTA', 'blue', win(t, T_REPITA - .2, T_COMENTA - .1), 540, 420, T_REPITA - .2, 3);
  const bub = $('bubble'); if (win(t, T_REPITA + .3, T_COMENTA - .1)) { bub.textContent = '“Biscoito, biscoito…” 🍪'; place(bub, true, 540, 600, pop(t - T_REPITA - .3, .3), -2); } else bub.style.opacity = 0;

  const cap2 = $('cap'); const capOff = t < T_VOCE - .1 || t >= T_COMENTA - .1;
