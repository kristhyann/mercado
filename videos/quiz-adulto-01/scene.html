  const Q = PL.q; let qi = -1; for (let i = 0; i < Q.length; i++) if (t >= Q[i].start) qi = i;
  const inFinal = t >= PL.final; if (inFinal) qi = -1;

  neonBars.forEach((b, i) => b.material.emissiveIntensity = 1.0 + .8 * Math.max(0, Math.sin(t * 4 + i)));
  ring1.material.emissiveIntensity = 1.2 + Math.sin(t * 3) * .4;
  icons.forEach(g => g.visible = false); sw.visible = false; okL.intensity = 0;

  else if (inRule) { const k = t - PL.rule; cp = V(Math.sin(t * .2) * 1.2, 2.6, 5.6); tg = V(0, 2.4, 0); }

    const timing = win(t, q.timer, q.reveal); if (timing) { sw.visible = true; const r = q.reveal - t; const v = Math.ceil(r); paintSW(Math.max(1, v), r / 3); sw.position.copy(CUBE); sw.position.z += .5; sw.scale.setScalar(1.05 * pop(t - q.timer, .25) * (1 + Math.max(0, .12 - ((q.reveal - t) % 1)) * 1.5)); cube.visible = false; cubeGlow.visible = false; sw.rotation.set(0, .3, Math.sin(t * 14) * .04); }

  else { const k = t - PL.final; cp = V(Math.sin(t * .3) * .6, 2.4, 5.8 - Math.min(k, 4) * .08); tg = V(0, 2.2, 0); }
  cam.position.copy(cp); cam.lookAt(tg); cam.updateProjectionMatrix(); cam.updateMatrixWorld(true);

  $('opts').style.opacity = cardIn > 0 ? 1 : 0; $('opts').style.transform = 'none';
  if (showQ) { [...optsEl.children].forEach((d, j) => { const k = easeOut(clamp((t - q.start - .15 - j * .07) / .3)) * (1 - ease(clamp((t - q.next + .3 - j * .03) / .3))); d.style.transform = `translateX(${(1 - k) * 1100}px)`;
      const rev = t >= q.reveal, ok = j === QZ[qi][2]; d.className = 'op' + (rev ? (ok ? ' ok' : ' no') : ''); d.querySelector('b').textContent = rev ? (ok ? '✅' : '❌') : ''; if (rev && ok) d.style.transform += ` scale(${1 + .06 * pop(t - q.reveal, .3)})`; }); }

  fixed($('rule'), inRule ? pop(t - 3.0, .35) * (1 - clamp((t - Q[0].start + .2) / .2)) : 0);
  fixed($('final'), inFinal && t < 74.3 ? pop(t - PL.final - .1, .4) : 0);

  renderer.render(scene, cam); return 1;
};
window.EVENTS = EV;
window.ready = true;
