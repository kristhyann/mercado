    return [V(3.4, R + 1.1, 7.8), V(0, R + 1.0, 0)]; }],
  // 3 ninguém aguenta: dorme; 8 h por dia
  [S(3), (t, k) => { setSky('space'); stars.visible = true; globeS.visible = true; eqB.forEach(b => b.visible = false); rtB.forEach(b => b.visible = false); plane.visible = false;
    const sleeping = t < T_8 - .1; spin.rotation.set(sleeping ? -S(3) * .5 : -S(3) * .5 - (t - T_8) * .4, 0, .25); walkOn(t, sleeping ? 'sleep' : 'walk');
    if (sleeping) zzz.forEach((z, i) => { const u = ((t * .7 + i / 3) % 1); z.visible = true; z.position.set(.55 + u * .4, R + .6 + u * 1.0, .2); z.scale.setScalar(.6 + u); });
    return [V(3.0, R + 1.1, 7.2), V(.2, R + .9, 0)]; }],
  // 4 pegadas (53 milhões) e pilha de tênis (50 pares)
  [S(4), (t, k) => { if (t < T_TENIS - .1) { setSky('day'); roadS.visible = true; const z = -(t - S(4)) * 1.4; rWalker.root.position.set(0, 0, z); rWalker.root.rotation.y = Math.PI; poseP(rWalker, PP.stand, 1, t); face(rWalker, 'calm', t);
      prints.forEach((p, i) => { const pz = z + 1.0 + i * .45; p.position.z = pz; p.visible = pz > z + .3; });
      return [V(roadS.position.x + 1.6, 2.0, z + 5.8), V(roadS.position.x, 1.7, z - 1.5)]; }
    setSky('watch'); shoeS.visible = true; const span = T_50 + .6 - T_TENIS;
    shoes.forEach(g => { const u = clamp((t - T_TENIS - g.userData.d * span) / .45); g.visible = u > 0; const yy = g.userData.y + (1 - easeOut(u)) * 5; g.position.set(g.userData.x, yy, g.userData.z); g.rotation.set(g.userData.rx, g.userData.ry + (1 - u) * 3, 0); });
    return [V(shoeS.position.x + .3, 3.6, 7.6 - (t - T_TENIS) * .15), V(shoeS.position.x, .9, 0)]; }],
  // 5 não dá pra andar em cima do mar
  [S(5), (t, k) => { setSky('beach'); beachS.visible = true; waves.forEach(w => { w.position.x = w.userData.x + Math.sin(t * .8 + w.userData.ph) * .5; w.position.z = -4 + Math.sin(t * .6 + w.userData.ph) * 2.2; });
    const u = ease(clamp((t - S(5)) / (T_NAO - S(5)))); bWalker.root.position.set(beachS.position.x * 0 + 0, 0, lerp(3, -1.3, u)); bWalker.root.rotation.y = Math.PI; const st = t > T_NAO;
    poseP(bWalker, st ? (t > T_MAR - .2 ? PP.shrug : PP.stand) : PP.stand, st ? 0 : 1, t); face(bWalker, 'shock', t); if (t > T_MAR - .2) bWalker.root.rotation.y = Math.PI - lerp(0, Math.PI * .85, ease(clamp((t - T_MAR + .2) / .4)));
    return [V(beachS.position.x + 2.6, 2.4, 4.8), V(beachS.position.x, .9, -2)]; }],
  // 6 Dave Kunst: a pé nos continentes, avião nos oceanos
  [S(6), (t, k) => { setSky('space'); stars.visible = true; globeS.visible = true; walker.root.visible = false; eqB.forEach(b => b.visible = false);
    const prog = clamp((t - S(6) - .2) / (T_LEVOU - S(6) - .4)); spin.rotation.set(.12, -prog * Math.PI * 2 + Math.PI / 2 + .4, 0);
    rtB.forEach(b => b.visible = b.userData.u < prog); const pl = routePos(Math.min(prog, .999)); const nx = routePos(Math.min(prog + .01, .999)); plane.visible = isOcean(prog) && t > T_CRUZ - 1.5; plane.position.copy(pl); plane.lookAt(spin.localToWorld(nx.clone()));
    return [V(0, 1.0, 19 - k * .2), V(0, .3, 0)]; }],
  // 7 final: cronômetro + quanto você chutou
  [S(7), (t, k) => { setSky('watch'); watchS.visible = true; wt.scale.setScalar(1); hand.rotation.z = -(t - S(7)) * 2.2; hand2.rotation.z = -(t - S(7)) * .2; wt.rotation.y = Math.sin(t * 1.5) * .15;
    qm.forEach((q, i) => { const a = q.userData.a + t * .8; q.position.set(Math.cos(a) * 2.6, 2.2 + Math.sin(a * 2 + i) * .3 + Math.sin(a) * 1.4, Math.sin(a) * .8 + .5); q.visible = true; });
    return [V(80, 2.2, 10.5), V(80, 1.4, 0)]; }],
];
window.draw = function (t) {
  hideAll(); hemi.intensity = 1.2; TNOW = t;
  let i = 0; while (i + 1 < SHOTS.length && SHOTS[i + 1][0] <= t) i++;
  sun.position.set(6, 12, 9); sun.target.position.set(0, 0, 0);
  const [cp, tg] = SHOTS[i][1](t, t - SHOTS[i][0]);
  cp.x += Math.sin(t * .35) * .04; cp.y += Math.sin(t * .27) * .025;
  cam.position.copy(cp); cam.lookAt(tg); cam.updateProjectionMatrix(); cam.updateMatrixWorld(true);
  if (i !== 2) { sun.position.copy(tg).add(V(5, 10, 8)); sun.target.position.copy(tg); }

  fixed($('hook'), t < T_CHUTA ? pop(t - .02, .3) * (1 - clamp((t - T_CHUTA + .15) / .15)) : 0);
  const tg2 = [$('t1'), $('t2')]; tg2.forEach(e => e.style.opacity = 0); $('big').style.opacity = 0;
  const tag = (el, txt, cls, on, x, y, t0, rot = -4) => { if (!on) return; el.textContent = txt; el.className = 'o tag ' + cls; place(el, true, x, y, pop(t - t0, .3), rot); };
  tag(tg2[0], 'CHUTA AÍ ⏱️', '', win(t, T_CHUTA, S(1)), 540, 400, T_CHUTA, -3);
  tag(tg2[0], 'PELA LINHA DO EQUADOR', 'white', win(t, S(1), S(2)), 540, 380, S(1), -2);
  BIG(win(t, T_40 - .3, S(2)), fmt(lerp(0, 40000, ease(clamp((t - T_40 + .3) / (T_KM - T_40 + .5))))), 'QUILÔMETROS', T_40 - .3);
  tag(tg2[0], 'SEM PARAR, SEM DORMIR', 'red', win(t, T_SEMD - .2, S(3)), 540, 380, T_SEMD - .2, -3);
  tag(tg2[1], '🚶 5 KM/H', 'white small', win(t, T_5 - .1, S(3)), 540, 500, T_5 - .1, 3);
  BIG(win(t, T_11 - .5, S(3)), fmt(lerp(0, 11, ease(clamp((t - T_11 + .5) / .9)))), 'MESES', T_11 - .5, 680);
  tag(tg2[0], 'NINGUÉM AGUENTA 😴', 'white', win(t, T_NING - .1, T_8 - .1), 540, 380, T_NING - .1, 3);
  tag(tg2[0], '8 HORAS POR DIA', '', win(t, T_8 - .1, S(4)), 540, 380, T_8 - .1, -3);
  BIG(win(t, T_3 - .4, S(4)), 'QUASE ' + Math.round(lerp(0, 3, ease(clamp((t - T_3 + .4) / .7)))), 'ANOS', T_3 - .4);
  BIG(win(t, T_53 - .2, T_TENIS - .1), fmt(lerp(0, 53000000, ease(clamp((t - T_53 + .2) / (T_PASSOS - T_53 + .4))))), 'PASSOS 👣', T_53 - .2);
  tag(tg2[0], '1 PAR = ~800 KM', 'white', win(t, T_800 - .2, S(5)), 540, 380, T_800 - .2, -3);
  BIG(win(t, T_50 - .2, S(5)), fmt(lerp(0, 50, ease(clamp((t - T_50 + .2) / .6)))), 'PARES DE TÊNIS 👟', T_50 - .2, 560);
  tag(tg2[0], 'NÃO DÁ PRA ANDAR NO MAR 🌊', 'blue', win(t, T_NAO - .1, S(6)), 540, 400, T_NAO - .1, -2);
  tag(tg2[0], 'DAVE KUNST · ANOS 70', 'dark', win(t, T_DAVE - .2, T_LEVOU), 540, 380, T_DAVE - .2, 0);
  tag(tg2[1], '🚶 A PÉ   ✈️ OCEANOS', 'white small', win(t, T_CRUZ - .1, T_LEVOU), 540, 500, T_CRUZ - .1, 2);
  BIG(win(t, T_4 - .3, S(7)), 'MAIS DE 4', 'ANOS', T_4 - .3);
  fixed($('final'), t >= T_CHUT2 - .2 ? pop(t - T_CHUT2 + .2, .35) : 0);
  $('wm').style.opacity = .85; fixed($('serie'), t > T_CHUTA - .1 ? 1 : 0);
  let wTxt = null, wSt = 0;
  for (let i = 0; i < SN.length; i++) for (const w2 of SN[i].words) if (t >= w2.start - .03 && t < w2.end + .2) { wTxt = w2.w; wSt = w2.start; }
  const cap = $('cap'); const capOff = t < T_CHUTA - .05 || t >= T_CHUT2 - .2;
  if (wTxt && !capOff) { cap.textContent = wTxt.toUpperCase().replace(/[.,!?:…]/g, ''); cap.className = 'o stroke' + (HL.test(wTxt) ? ' hl' : ''); const k = t - wSt; fixed(cap, k < .06 ? lerp(.75, 1.1, clamp(k / .06)) : k < .12 ? lerp(1.1, 1, (k - .06) / .06) : 1); } else fixed(cap, 0);
