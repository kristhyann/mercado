// ---------- estados ----------
function nightK(t) { if (t < S(7) + .3) return 1; if (t < S(7) + 1.4) return 1 - ease((t - S(7) - .3) / 1.1); if (win(t, T_DORME - .1, S(11))) return 1; return 0; }
const tmp = new THREE.Vector3(), tmp2 = new THREE.Vector3();
function eyeOf(p) { return p.head.localToWorld(V(0, .03, .15)); }
function phoneState(t) {
  if (t < S(2)) return t < T_NENHUMA ? 'cal' : 'msg';
  if (t < S(3)) return t < T_INSTA ? 'msg' : 'notif';
  if (win(t, S(8), S(9))) return 'cal';
  if (win(t, S(9), S(11))) return 'chat';
  if (win(t, S(13), S(14))) return 'reel';
  return 'cal';
}
const phoneHeld = t => t < S(4) || win(t, S(7), S(10)) || win(t, S(13), S(14));

// ---------- planos (cortes secos a cada ~3s) ----------
const POV = 'pov';
const SHOTS = [
  [0, POV], [S(1), [1.25, 1.4, .95], [.3, 1.15, -.95]], [S(2), POV], [S(3), [.95, 1.55, .55], [.3, 1.28, -.98]],
  [S(4), [.62, 1.12, -.02], [.3, .8, -.52]], [S(5), [1.05, 1.42, .55], [1.35, 1.5, -2.0]], [S(6), [.5, 1.6, 3.7], [-.8, 1.0, -.5]],
  [S(7), [-.3, 1.5, 1.6], [-1.0, 1.55, -2.0]], [S(8), POV], [T_HORARIO, [1.05, 1.42, .55], [1.35, 1.5, -2.0]],
  [S(10), [.5, 1.2, .55], [.05, .88, -.55]], [T_DORME, [.2, 1.45, 1.6], [1.5, .55, -.4]], [S(11), [1.1, 1.38, .45], [.3, 1.15, -.98]],
  [S(12), [1.6, 1.45, .4], [.3, .95, -.6]], [S(13), POV], [S(14), [.3, 1.5, 2.7], [.3, 1.3, .1]],
];
function camAt(t) {
  let i = 0; while (i + 1 < SHOTS.length && SHOTS[i + 1][0] <= t) i++;
  const [t0, a, b] = SHOTS[i]; const k = t - t0;
  if (a === POV) { const eye = eyeOf(pro); const p = pro.head.localToWorld(V(0, .06, .17)); cam.position.copy(p); phone.getWorldPosition(tmp); cam.lookAt(tmp.x, tmp.y - .022, tmp.z); cam.fov = 40; }
  else { const pa = V(...a), tg = V(...b); const p = pa.clone().lerp(tg, Math.min(.1, k * .03)); p.x += Math.sin(t * .4) * .01; cam.position.copy(p); cam.lookAt(tg); cam.fov = 40; }
  cam.updateProjectionMatrix(); cam.updateMatrixWorld(true);
}

const $ = id => document.getElementById(id);

function fixed(el, s) { el.style.opacity = s > 0 ? 1 : 0; el.style.transform = `scale(${Math.max(s, .001)})`; }

[[.02, 'buzz'], [T_NENHUMA, 'pop'], [T_NADA, 'buzzx'], [T_SEMANA, 'pop'], [T_AMAM, 'ding'], [S(5) + .3, 'buzz'], [T_ESQUECE, 'pop'], [T_DEPOIS, 'pop'], [T_OUTRA, 'buzz'], [S(7), 'ding'], [T_CHEIA, 'win'], [T_LEMB + .1, 'pop'], [T_SUMIDA, 'pop'], [T_PREENCH, 'ding'], [T_IA, 'zap'], [T_CORRER, 'pop'], [T_MEDO, 'pop'], [T_UNHA, 'ding'], [T_AGENDA1, 'win'], [T_AGENDA2, 'win']].forEach(([t, k]) => ev(t, k));

window.draw = function (t) {
  const nk = nightK(t);
  hemi.intensity = lerp(1.15, .75, nk); hemi.color.setHex(nk > .5 ? 0x8090D8 : 0xFFFFFF); sun.intensity = lerp(1.4, .25, nk); sun.color.setHex(nk > .5 ? 0x7A8CFF : 0xFFF2DD);
  lamp.intensity = lerp(.6, 1.6, nk); sky.material.color.setHex(nk > .5 ? 0x1B2450 : 0x8FD3FF); moon.visible = nk > .5; sunDisk.visible = nk <= .5; starsW.forEach(s => s.visible = nk > .5);
  scene.background = new THREE.Color(nk > .5 ? 0x141a3a : 0xFDE7C8);
  // ---- profissional

  let P = PP.sitDesk, expr = 'neutral';

  if (win(t, S(3), S(4))) { P = P_CHEST; expr = 'sad'; }
  if (win(t, S(4), S(7))) { P = PP.sitSlump; expr = 'sad'; }
  if (win(t, S(7), S(8))) { P = PP.sitCheer; expr = 'happy'; }
  if (win(t, S(11), S(12))) { P = PP.sitCup; expr = 'calm'; }
  if (win(t, S(12), S(13))) { P = PP.type; expr = 'happy'; }
  if (sleeping) { P = PP.lie; expr = 'calm'; }
  if (standing) { P = mixP(PP.cheer, P_WAVE, .5 + .5 * Math.sin(t * 6)); expr = 'happy'; }
  if (sleeping) { pro.root.position.set(1.75, .5, .55); pro.root.rotation.set(-Math.PI / 2, 0, 0); }
  else if (standing) { pro.root.position.set(.3, 0, .15); pro.root.rotation.set(0, 0, 0); }
  else { pro.root.position.set(.3, 0, -1.08); pro.root.rotation.set(0, 0, 0); }
  poseP(pro, P, 0, t); face(pro, expr, t); if (sleeping) pro.eyes.forEach(e => e.scale.y = .12);
  pro.root.updateMatrixWorld(true);
  // ---- celular
  const held = phoneHeld(t); const st = phoneState(t);
  if (held) { const eye = eyeOf(pro); const fwd = V(0, -.17, .36); phone.position.copy(eye).add(fwd); phone.lookAt(eye); phone.visible = true; }
  else if (win(t, S(10), T_DORME)) { phone.visible = true; phone.position.set(.42, .752, -.5); phone.rotation.set(-Math.PI / 2, 0, -.3); }
  else phone.visible = false;
  if (phone.visible) drawPhone(st, t, nk > .5);
  glow.intensity = held && nk > .5 ? .9 : 0; glow.position.copy(phone.position).add(V(0, .05, .1));
  // ---- calendário de parede
  const fillN = t >= S(8) ? Math.floor(clamp((t - S(8)) / 2.6) * 20) : 0; const sp = t >= T_PREENCH; const key = fillN + '_' + sp; if (key !== calKey) { drawCal(fillN, sp); calKey = key; }
  // ---- cliente
  cli.root.visible = win(t, S(6), S(7)) || win(t, S(12), S(13));
  if (win(t, S(6), S(7))) { let x = -.9, z = .3, walk = 0, ry = 0, Pc = PP.stand, ec = 'neutral';
    if (t >= T_ESQUECE) { Pc = PP.think; ec = 'neutral'; } if (t >= T_DEPOIS) { Pc = PP.shrug; ec = 'happy'; }
    if (t >= T_OUTRA) { const u = clamp((t - T_OUTRA) / 1.6); x = lerp(-.9, -2.35, u); z = lerp(.3, 0, u); walk = u < 1 ? 1 : 0; ry = -Math.PI / 2; Pc = PP.stand; ec = 'happy'; cli.root.visible = u < .98; }
    cli.root.position.set(x, 0, z); cli.root.rotation.set(0, ry, 0); poseP(cli, Pc, walk, t); face(cli, ec, t); }
  if (win(t, S(12), S(13))) { cli.root.position.set(.3, 0, -.02); cli.root.rotation.set(0, Math.PI, 0); poseP(cli, PP.sitDesk, 0, t); face(cli, 'happy', t); }
  doorP.rotation.y = win(t, T_OUTRA - .2, S(7)) ? -1.3 * ease(clamp((t - T_OUTRA + .2) / .5)) : 0;
  // ---- mão, pincel, caneca, robô

  brush.visible = win(t, S(12), S(13)); if (brush.visible) { brush.position.set(.3 + Math.sin(t * 4) * .02, .83, -.57); brush.rotation.set(.5, 0, .3); }
  mug.visible = win(t, S(11), S(12)); if (mug.visible) { pro.armL.hand.getWorldPosition(tmp); pro.armR.hand.getWorldPosition(tmp2); mug.position.copy(tmp).add(tmp2).multiplyScalar(.5).add(V(0, .04, .03)); }
  robot.visible = t >= S(10) && t < S(11); if (robot.visible) { robot.scale.setScalar(Math.max(.001, pop(t - S(10) - .1, .35))); robot.userData.arms.forEach((a, i) => a.rotation.x = -.9 + Math.sin(t * 18 + i * 3) * .3); robot.userData.ant.material.color.setHex(Math.sin(t * 8) > 0 ? 0xFF5FA2 : 0x22E5FF); }
  if (win(t, T_DORME - .1, S(11))) { robot.position.set(-.02, .745, -.55); }
  sparkles.forEach((s, i) => { const on = win(t, S(4), S(5)) || win(t, S(12), S(13)) || win(t, S(7), S(8)); s.visible = on; if (!on) return; const c = win(t, S(7), S(8)) ? V(.3, 1.3, -1.0) : V(.3, .8, -.53); const r = win(t, S(7), S(8)) ? .45 : .09; const a = i / 12 * Math.PI * 2 + t * 1.6; s.position.set(c.x + Math.cos(a) * r, c.y + Math.sin(a * 2 + i) * r * .5, c.z + Math.sin(a) * r * .6); s.rotation.y = t * 4; });
  zzz.forEach((z, i) => { z.visible = sleeping; if (!sleeping) return; const u = ((t * .6 + i / 3) % 1); z.position.set(1.75 + u * .25, .85 + u * .45, -.95 + u * .1); z.scale.setScalar(.08 + u * .1); z.material.opacity = 1 - u; });
  camAt(t);

  // ---------- textos ----------
  fixed($('hook'), t < S(1) ? (t < .12 ? lerp(.85, 1.05, t / .12) : 1) * (1 - clamp((t - S(1) + .15) / .15)) : 0);
  const lb = [...LBL].reverse().find(l => t >= l[0]); const lbOn = lb && lb[1];
  if (lbOn) { $('label').firstElementChild.textContent = lb[1]; fixed($('label'), pop(t - lb[0], .3)); } else fixed($('label'), 0);
  const T = [$('t1'), $('t2'), $('t3')]; T.forEach(e => { e.style.opacity = 0; e.style.fontSize = ''; });
  const tag = (el, txt, cls, on, x, y, t0, rot = -4) => { if (!on) return; el.textContent = txt; el.className = 'o tag ' + cls; place(el, true, x, y, pop(t - t0, .3), rot); };
  tag(T[0], '0 MENSAGENS', 'red', win(t, T_NENHUMA, S(2)), 540, 560, T_NENHUMA, -4);
  tag(T[0], 'E A SEMANA QUE VEM?', '', win(t, T_SEMANA, S(4)), 540, 560, T_SEMANA, -3);
  tag(T[0], 'CLIENTES AMAM', 'pink', win(t, T_AMAM, S(5)), 540, 560, T_AMAM, -4);
  tag(T[0], 'NÃO ENCHE AGENDA', 'red', win(t, S(5) + .3, S(6)), 540, 1000, S(5) + .3, 3);
  tag(T[0], 'ESQUECE', '', win(t, T_ESQUECE, S(7)), 540, 560, T_ESQUECE, -4);
  tag(T[1], 'DEIXA PRA DEPOIS', 'blue', win(t, T_DEPOIS, S(7)), 540, 680, T_DEPOIS, 3);
  tag(T[2], 'MARCA COM OUTRA', 'red', win(t, T_OUTRA, S(7)), 540, 800, T_OUTRA, -3);
  tag(T[0], 'SEMANA CHEIA', 'green', win(t, T_CHEIA, S(9)), 540, 560, T_CHEIA, -4);
  tag(T[0], 'LEMBRETE AUTOMÁTICO', 'green', win(t, T_LEMB + .1, T_HORARIO), 540, 1080, T_LEMB + .1, -3);
  tag(T[1], 'CLIENTE SUMIDA VOLTOU', 'blue', win(t, T_SUMIDA, T_HORARIO), 540, 1190, T_SUMIDA, 3);
  tag(T[0], 'HORÁRIO VAGO PREENCHIDO', 'green', win(t, T_PREENCH, S(10)), 540, 1000, T_PREENCH, -3);
  tag(T[0], 'INTELIGÊNCIA ARTIFICIAL', 'blue', win(t, T_IA, T_DORME), 540, 560, T_IA, -3);
  tag(T[0], 'TRABALHA ATÉ DORMINDO', 'pink', win(t, T_DORME, S(11)), 540, 560, T_DORME, -3);
  tag(T[0], '✕ CORRER ATRÁS DE CLIENTE', 'red', win(t, T_CORRER, S(12)), 540, 560, T_CORRER, -3); if (win(t, T_CORRER, S(12))) T[0].style.fontSize = '54px';
  tag(T[1], '✕ DOMINGO COM MEDO', 'red', win(t, T_MEDO, S(12)), 540, 690, T_MEDO, 3);
  const cm = $('comic'); cm.style.fontSize = '160px';
  if (win(t, T_NADA, S(3))) { cm.textContent = 'NADA.'; place(cm, true, 540, 600, pop(t - T_NADA, .25), -6); }
  else if (win(t, S(7), S(8))) { cm.textContent = 'OUTRO DOMINGO...'; cm.style.fontSize = '96px'; place(cm, true, 540, 600, pop(t - S(7), .3), -4); }
  else if (win(t, S(10), T_IA)) { cm.textContent = 'QUEM?'; place(cm, true, 540, 600, pop(t - S(10), .25), -6); }
  else if (win(t, T_UNHA, S(13))) { cm.textContent = 'UNHA!'; place(cm, true, 540, 600, pop(t - T_UNHA, .25), -6); }
  else if (win(t, T_AGENDA1, S(14)) || t >= T_AGENDA2 - .05) { const t0 = t >= T_AGENDA2 - .05 ? T_AGENDA2 - .05 : T_AGENDA1; cm.textContent = 'AGENDA'; cm.style.fontSize = '210px'; cm.style.color = '#FF5FA2'; place(cm, true, 540, t >= S(14) ? 1120 : 640, pop(t - t0, .3) * (1 + .04 * Math.sin(t * 9)), -5); }
  else cm.style.opacity = 0;
  if (cm.textContent !== 'AGENDA') cm.style.color = '';
  fixed($('final'), t >= S(14) + .2 ? pop(t - S(14) - .2, .35) : 0);
  $('wm').style.opacity = .8;
  // legenda
  let wTxt = null, wSt = 0;
  for (let i = 0; i < SN.length; i++) for (const w2 of SN[i].words) if (t >= w2.start - .03 && t < w2.end + .2) { wTxt = w2.w; wSt = w2.start; }
  const cap = $('cap');
  if (wTxt && t > S(1) - .1 && t < S(14)) { cap.textContent = wTxt.toUpperCase().replace(/[.,!?:]/g, ''); cap.className = 'o stroke' + (HL.test(wTxt) ? ' hl' : ''); const k = t - wSt; fixed(cap, k < .06 ? lerp(.75, 1.1, clamp(k / .06)) : k < .12 ? lerp(1.1, 1, (k - .06) / .06) : 1); } else fixed(cap, 0);
  renderer.render(scene, cam); return 1;
};
