function stateAt(t) {
  const s = { cams: ['r_wide'], camK0: 0, fer: { at: 'desk', pose: 'type', face: 'neutral' }, light: 'day', outfit: 'home', screen: { mode: 'off' }, card: null, cardT: 0, chip: null, stock: 1, sale: 0, npc: 0, mom: null, mgr: null, momFace: 'neutral', momPose: 'sit', sepia: false, lid: 1, postit: 0, title: false, fadeT: -9, ferT: 0, prevFer: null, screenT: 0, lightT: 0, prevLight: 'day', camsT: 0, camsP: 0 };
  for (const b of BEATS) {
    if (b.t > t + 1e-6) break;
    if (b.cams) { s.cams = b.cams; s.camsP = b.p; s.camsK = b.k; s.camsT = b.t; }
    if (b.fer) { s.prevFer = s.fer; s.fer = b.fer; s.ferT = b.t; }
    if (b.light && b.light !== s.light) { s.prevLight = s.light; s.light = b.light; s.lightT = b.t; }
    if (b.screen) { s.screen = b.screen; s.screenT = b.t; }
    if ('card' in b) { s.card = b.card; s.cardT = b.t; s.cardP = b.p; s.cardK = b.k; }
    for (const k of ['outfit', 'chip', 'stock', 'sale', 'npc', 'mom', 'mgr', 'momFace', 'momPose', 'sepia', 'lid', 'postit', 'title']) if (k in b) s[k] = b[k];
    if (b.fade) s.fadeT = b.t;
  }
  return s;
}

};
function placePerson(p, at, t, walkT0) {
  const a = AT[at]; const o = a[0]; p.root.position.set(o.x + a[1], a[2], o.z + a[3]); p.root.rotation.set(a[5] === 'lie' ? -Math.PI / 2 : 0, a[4], 0);
  if (at === 'walk') { const u = t - walkT0; p.root.position.z = o.z + 7 - u * .9; }
}

const panel = document.getElementById('panel'); let lastCardKey = '';
const fmt = (v, dec = 0) => v.toLocaleString('pt-BR', { minimumFractionDigits: dec, maximumFractionDigits: dec });
function cardHTML(c, u, nSent) {
  const ttl = c.title ? `<h3>${c.title}</h3>` : '';
  switch (c.type) {
    case 'big': return `<div class="card"><div class="big ${c.cls || ''}" style="font-size:${c.big.length > 14 ? 74 : 96}px">${c.big}</div>${c.sub ? `<div class="sub" style="margin-top:12px">${c.sub}</div>` : ''}</div>`;
    case 'money': { const v = lerp(c.from, c.to, ease(u / (c.dur || 1.2))); return `<div class="card"><div class="sub" style="font-weight:900;letter-spacing:1px">${c.label}</div><div class="big ${c.cls}">${c.pre || ''}${fmt(v, c.dec ?? (c.pre === 'US$ ' && c.to < 20 ? 0 : 0))}${c.suf || ''}</div></div>`; }
    case 'list': { const vis = c.bySentence ? c.bySentence.filter(k => k <= nSent).length : Math.min(c.items.length, 1 + Math.floor(u / (c.each || .8))); return `<div class="card">${c.title ? `<h3>${c.title}</h3>` : ''}<ul>${c.items.map((it, i) => `<li style="opacity:${i < vis ? 1 : 0}"><b style="background:${c.x ? '#E11D48' : '#16A34A'}">${c.x ? '✕' : '✓'}</b>${it}</li>`).join('')}</ul></div>`; }
    case 'quote': return `<div class="card"><div class="quote" style="font-size:${c.big ? 52 : 44}px">${c.text}</div></div>`;
    case 'stat': return `<div class="card"><div class="big r" style="font-size:150px">${c.big}</div><div class="sub" style="font-weight:800;color:#111;font-size:34px">${c.text}</div><div class="sub" style="font-size:22px;margin-top:14px">Fonte: ${c.src}</div></div>`;
    case 'compare': return `<div style="display:flex;gap:22px">${[c.l, c.r].map((x, i) => `<div class="card" style="flex:1;padding:24px;opacity:${i === 0 || u > .5 ? 1 : 0};border-color:#111"><div class="sub" style="font-weight:900;color:${x[2]};font-size:26px;letter-spacing:1px">${x[0]}</div><div style="font-weight:900;font-size:40px;line-height:1.12;margin-top:8px">${x[1]}</div></div>`).join('')}</div>`;
    case 'months': { const n = Math.min(12, Math.floor(u * 3.2)); return `<div class="card"><h3>${c.title}</h3><div class="cal" style="grid-template-columns:repeat(4,1fr)">${Array.from({ length: 12 }, (_, i) => `<div style="background:${i < n ? (i < 6 ? '#16A34A' : i < 8 ? '#F59E0B' : '#E11D48') : '#E5E7EB'};color:#fff;height:70px">${['JAN', 'FEV', 'MAR', 'ABR', 'MAI', 'JUN', 'JUL', 'AGO', 'SET', 'OUT', 'NOV', 'DEZ'][i]}</div>`).join('')}</div><div class="sub" style="margin-top:12px;font-weight:800">6? 8? Apertando muito, 1 ano. E depois?</div></div>`; }
