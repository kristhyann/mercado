  // 1 pouca luz

  // 2 olhos enormes captam luz
  [S(2), (t, k) => { forest.visible = true; owlPerch(t, { look: 0 }); const u = owl.userData; const s = 1 + .35 * ease(clamp((t - T_ENORM + .2) / .5)); u.eyes.forEach(e => e.scale.setScalar(s));

  // 4 ouvidos assimétricos

    if (t > T_DESC - .1) { cross.visible = true; cross.position.set(mouse.position.x, .25, mouse.position.z); cross.lookAt(cam.position); cross.scale.setScalar(lerp(2.5, 1, ease(clamp((t - T_DESC + .1) / .7)))); }
    if (t < T_DESC - .1) return [h.clone().add(V(.0, .02, 1.15)), h];
    const m = mouse.position; return [V(m.x + .9, 1.0, m.z + 1.7), V(m.x, .15, m.z)]; }],
  // 5 ao chegar perto, barulho denuncia
  [S(5), (t, k) => { forest.visible = true; hemi.intensity = 1.0; moonL.intensity = 2.2; const u = clamp((t - S(5) - .3) / 3.5); owl.position.lerpVectors(PERCH, V(.8, 1.2, 1.4), ease(u)); owl.rotation.set(.35 * u, .8, 0); poseOwl(owl, t, { spread: 1, flap: 9 });
    mouse.rotation.y = t > T_DEN ? Math.sin(t * 20) * .2 : 0; return [V(2.2, 1.0, 4.0), V(.6, 1.2, 1.2)]; }],
  // 6 penas com franjas

    return [clawS.position.clone().add(V(.7, 1.85, 1.6 - k * .03)), clawS.position.clone().add(V(0, 1.5, .1))]; }],
  // 8 caçada em câmera lenta com cada adaptação destacada
  [S(8), (t, k) => { forest.visible = true; const u = ease(clamp((t - S(8)) / (T_SIL - S(8) + .4))); const P0 = V(-.2, 2.4, 0), P1 = V(1.6, .35, 2.2);
    const pos = P0.clone().lerp(P1, u); pos.y += Math.sin(u * Math.PI) * .25; owl.position.copy(pos); owl.rotation.set(lerp(.5, -.2, u), .9, 0); poseOwl(owl, t * .35, { spread: 1, flap: u < .85 ? 2.5 : 0, talons: ease(clamp((u - .6) / .3)) });
