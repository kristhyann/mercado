  let si = -1; SQ.forEach((s, i) => { if (t >= s - .1) si = i; }); const cta = t >= T_SEU - .1; if (cta) si = -2;
  [bars, clock].forEach(o => o.visible = false); [fatS, sugS, vet, phone, bone, ...sym, ...molecules, ...hearts].forEach(o => o.visible = false);

    dpose = { sit: 1, wag: 1.2, lookUp: .35, look: .5, pant: 1 }; cp = V(lerp(-.2, .4, t / 4), 1.5, lerp(4.8, 4.0, easeOut(t / 4))); tg = V(.15, .85, -.2); }
  else if (si === 0) { // teobromina acumulando
    dpos = V(0, 0, .4); dry = 0; dpose = { sit: 1, wag: .2, lookUp: 0 }; table.visible = false;
    if (t > T_TEO) molecules.forEach(m => { m.visible = true; const u = ((t - T_TEO) * .5 + m.userData.p) % 1; m.position.set(m.userData.x, lerp(2.6, 1.0, u), .5); m.scale.setScalar(.18 * Math.sin(u * Math.PI)); });
    if (t > T_ACUM) dpose = { sit: 1, wag: 0, lookUp: -.15, tilt: Math.sin(t * 3) * .1 };
    cp = V(Math.sin(t * .4) * .5, 1.4, 3.6); tg = V(0, .85, 0); }
  else if (si === 1 || si === 2) { // comparação de chocolates
    bars.visible = true; table.visible = false; dpos = V(1.25, 0, 1.1); dry = -.6; dpose = { sit: 1, wag: .6, look: -.4 };
    cols.forEach((c, i) => { const g = ease(clamp((t - SQ[1] - .5 - i * .3) / .8)); const h = Math.max(.02, LV[i] * g); c.col.scale.y = h; c.col.position.y = h / 2; c.col.material.color.setHex(i === 0 ? 0xDC2626 : i === 1 ? 0xF97316 : 0xFACC15);
      const hi = (si === 1 && i === 0 && t > T_CACAU) || (si === 2 && i === 2); c.g.scale.setScalar(hi ? 1.12 + Math.sin(t * 5) * .03 : 1); });
    if (si === 2 && t > T_GORD) { fatS.visible = sugS.visible = true; fatS.position.set(.75, 1.15, .2); sugS.position.set(1.25, 1.1, .2); fatS.scale.setScalar(.4 * pop(t - T_GORD, .3)); sugS.scale.setScalar(.4 * pop(t - T_GORD - .2, .3)); }
    cp = V(.15, 2.1, 6.8); tg = V(.15, 1.0, 0); }
  else if (si === 3) { // sintomas demoram
    table.visible = false; clock.visible = t < T_VOMITO; clock.position.set(.45, 1.5, -.6); clock.scale.setScalar(.6); hMp.rotation.z = -t * 6; hHp.rotation.z = -t * .5; dpos = V(-.3, 0, .4); dry = .2;
    const shake = t > T_TREM ? Math.sin(t * 50) * .03 : 0; dpose = { sit: 0, lie: t > T_CONV ? 1 : 0, wag: 0, lookUp: -.1 }; dpos.x += shake;
    [T_VOMITO, T_VOMITO + .6, T_CORACAO, T_TREM, T_CONV].forEach((tt, i) => { const s = sym[i]; s.visible = t > tt; const a = i * 1.25 + t * .4; s.position.set(dpos.x + Math.cos(a) * .85, 1.2 + Math.sin(a) * .35, .3); s.scale.setScalar(.45 * pop(t - tt, .3)); });
    cp = V(.25, 1.6, 4.6); tg = V(.15, 1.05, 0); }
  else if (si === 4) { // veterinário
    table.visible = false; dpos = V(-.4, 0, .4); dry = .5; dpose = { sit: 1, wag: .3, lookUp: .2 };
    vet.visible = t > T_VET - .2; vet.position.set(.85, 1.9, -.6); vet.scale.setScalar(.9 * pop(t - T_VET + .2, .3)); phone.visible = t > T_QUAL - .2; phone.position.set(.9, 1.0, .2); phone.scale.setScalar(.5 * pop(t - T_QUAL + .2, .3));
    cp = V(.3, 1.6, 4.6); tg = V(.25, 1.1, -.2); }
  else { // CTA: osso no lugar do chocolate
    bar.visible = wrap.visible = false; bone.visible = true; bone.position.set(.75, 1.05, -.6); dpose = { sit: 1, wag: 1.5, lookUp: .25, pant: 1 };
    hearts.forEach(h => { h.visible = true; const u = (t * .5 + h.userData.p) % 1; h.position.set(-.55 + h.userData.x, 1.3 + u * 1.2, .3); h.scale.setScalar(.2 * Math.sin(u * Math.PI)); });
    cp = V(Math.sin(t * .4) * .4, 1.7, 4.8); tg = V(.1, 1.0, -.2); }

  // HTML
  fixed($('hook'), si === -1 ? pop(t - .02, .3) : 0);
  { const el = $('card'); if (si >= 0) { $('ctext').textContent = STMT[si]; place(el, true, 540, 330, pop(t - SQ[si] + .1, .3)); } else el.style.opacity = 0; }
  { const el = $('stamp'); if (si >= 0 && t >= RV[si]) { const v = ANS[si]; el.textContent = v ? '✅ VERDADEIRO' : '❌ FALSO'; el.style.background = v ? '#16A34A' : '#DC2626'; el.style.fontSize = v ? '96px' : '120px'; place(el, true, 540, 600, pop(t - RV[si], .25) * (t - RV[si] < 1.6 ? 1 : 0), v ? -4 : 4); } else el.style.opacity = 0; }
  { const el = $('meter'); const on = si === 0 && t > T_TEO; el.style.opacity = on ? 1 : 0; el.style.transform = 'none'; el.querySelector('i').style.width = (on ? clamp((t - T_TEO) / (SQ[1] - T_TEO - .3)) * 100 : 0) + '%'; }
  const tg1 = $('t1'); tg1.style.opacity = 0;
  const tag = (txt, cls, on, y, t0, rot = -3) => { if (!on) return; tg1.textContent = txt; tg1.className = 'o tag ' + cls; place(tg1, true, 540, y, pop(t - t0, .3), rot); };
  tag('🍫 MAIS CACAU = MAIS PERIGO', 'red small', win(t, T_CACAU, SQ[2] - .1), 1240, T_CACAU);
  tag('🧈 GORDURA + 🍬 AÇÚCAR', 'white small', win(t, T_GORD, SQ[3] - .1), 1240, T_GORD);
  tag('⏰ PODE LEVAR HORAS', '', win(t, T_HORAS - .2, T_VOMITO), 1240, T_HORAS - .2);
  tag('🏥 VETERINÁRIO NA HORA', 'green', win(t, T_VET - .2, T_QUAL), 1240, T_VET - .2);
  tag('📝 QUAL CHOCOLATE + QUANTO', 'white small', win(t, T_QUAL, T_SEU - .1), 1240, T_QUAL);
  fixed($('final'), cta ? pop(t - T_SEU + .1, .35) : 0);
  $('wm').style.opacity = .85;
  let wTxt = null, wSt = 0;
  for (const w2 of ALL) if (t >= w2.start - .03 && t < w2.end + .2) { wTxt = w2.w; wSt = w2.start; }
  const cap2 = $('cap'); const capOff = si === -1 || cta;
  if (wTxt && !capOff) { cap2.textContent = wTxt.toUpperCase().replace(/[.,!?:…"“”]/g, ''); cap2.className = 'o stroke' + (HL.test(wTxt) ? ' hl' : ''); const k = t - wSt; fixed(cap2, k < .06 ? lerp(.75, 1.1, clamp(k / .06)) : k < .12 ? lerp(1.1, 1, (k - .06) / .06) : 1); } else fixed(cap2, 0);
  renderer.render(scene, cam); return 1;
};
