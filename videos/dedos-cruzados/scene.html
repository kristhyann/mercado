  [T_SO - .1, (t, k) => { world('hand'); const c = ease(clamp((t - T_SO) / .9)); poseHand(hand, c, t); patchI.visible = patchM.visible = true; const sp = ballSpot(hand);
    if (t > T_TOCA - .4) { putBall(ball, sp.clone().add(V(0, 0, lerp(.6, 0, ease(clamp((t - T_TOCA + .4) / .5))))), t); } hits.forEach((h, i) => { h.visible = t > T_TOCA; h.position.copy(sp).add(V(i ? .12 : -.12, 0, .05)); h.scale.setScalar(.26 + Math.sin(t * 6) * .04); });
    return HC(3.4, 1.85, -.25, 1.45, -.25); }],
  // 8 o cérebro não atualiza: usa o mapa antigo (mão fantasma aberta)
  [T_O - .1, (t, k) => { world('hand'); poseHand(hand, 1, t); poseHand(ghost, 0, t); ghost.root.visible = t > T_MAPA - .9 || t > T_ATUAL; ghost.root.position.set(0, 0, .02); patchI.visible = patchM.visible = true; putBall(ball, ballSpot(hand), t);
    brainS.visible = true; brainS.position.set(.32, 2.45, .2); brainS.scale.setScalar(.45 * pop(t - T_O, .3)); return HC(4.0, 1.8, -.12, 1.4, -.12); }],
  // 9 pelo mapa antigo: dois toques = dois objetos
  [T_E - .1, (t, k) => { world('hand'); poseHand(hand, 1, t); poseHand(ghost, 0, t); ghost.root.visible = true; patchI.visible = patchM.visible = true; putBall(ball, ballSpot(hand), t);
    const op = outerPts(ghost); const s = pop(t - T_DOIST, .35); if (t > T_DOIST) { putBall(ball2, op[0].clone().add(V(-.06, 0, 0)), t); putBall(ball3, op[1].clone().add(V(.06, 0, 0)), t); ball2.scale.setScalar(Math.max(.001, s)); ball3.scale.setScalar(Math.max(.001, s)); }
    brainS.visible = true; brainS.position.set(.32, 2.45, .2); brainS.scale.setScalar(.45); return HC(4.0, 1.8, -.12, 1.4, -.12); }],
  // 10 resultado: uma bolinha vira duas
  [T_RES - .1, (t, k) => { world('hand'); poseHand(hand, 1, t); const sp = ballSpot(hand); const d = ease(clamp((t - T_VIRA) / .6)); ball2.scale.setScalar(1); ball3.scale.setScalar(1);
    putBall(ball, sp, t); ball.visible = d < .3; putBall(ball2, sp.clone().add(V(-.13 * d, 0, .05)), t); putBall(ball3, sp.clone().add(V(.13 * d, 0, .05)), t); if (d <= 0) { ball2.visible = ball3.visible = false; }
    return HC(3.4, 1.85, -.25, 1.45, -.25); }],
  // 11 abre os olhos: era uma só
  [T_AGORA2 - .1, (t, k) => { world('hand'); poseHand(hand, 1 - ease(clamp((t - T_ERA) / .8)), t); const sp = ballSpot(hand); const m = ease(clamp((t - T_ABRE - .3) / .8)); ball2.scale.setScalar(1); ball3.scale.setScalar(1);
    if (m < 1) { putBall(ball2, sp.clone().add(V(-.13 * (1 - m), 0, .05)), t); putBall(ball3, sp.clone().add(V(.13 * (1 - m), 0, .05)), t); } putBall(ball, sp, t); ball.visible = m > .6;
    return HC(3.4, 1.85, -.22, 1.45, -.22); }],
  // 12 CTA
  [T_SEU3 - .1, (t, k) => { world('hand'); poseHand(hand, ease(clamp((t - T_SEU3) / .8)), t); hand.root.rotation.y = Math.sin(t * .8) * .12; return HC(4.0, 1.9, -.1, 1.75, -.1); }],
];
// pálpebras: fecha em T_FECHA (fica vinheta até T_ISSO), abre em T_ABRE
function lids(t) { let c = 0; // 0 aberto, 1 fechado
  if (win(t, T_FECHA, T_FECHA + .9)) c = ease(clamp((t - T_FECHA) / .35)) * (1 - ease(clamp((t - T_FECHA - .55) / .35))) ;
  if (win(t, T_AGORA2, T_ABRE + 1.2)) c = t < T_ABRE ? ease(clamp((t - T_AGORA2) / .4)) : 1 - ease(clamp((t - T_ABRE - .1) / .9));
  const h = 1000 * c; $('lidT').style.opacity = c > 0 ? 1 : 0; $('lidB').style.opacity = c > 0 ? 1 : 0; $('lidT').style.transform = `translateY(${h * .98}px)`; $('lidB').style.transform = `translateY(${-h * .94}px)`;
  const vg = win(t, T_FECHA + .5, T_ISSO - .1) || win(t, T_RES - .1, T_ABRE + .6); $('vig').style.opacity = vg ? 1 : 0; }
window.draw = function (t) {
  let i = 0; while (i + 1 < SHOTS.length && SHOTS[i + 1][0] <= t) i++;
  hand.root.rotation.y = 0; ball.scale.setScalar(1);

  const off = tbl.visible ? tbl.position : gr.visible ? gr.position : V(0, 0, 0); cp.add(off); tg.add(off);
  cp.x += Math.sin(t * .35) * .01; cp.y += Math.sin(t * .27) * .007;
  cam.position.copy(cp); cam.lookAt(tg); cam.updateProjectionMatrix(); cam.updateMatrixWorld(true);
  sun.position.copy(tg).add(V(2.5, 6, 4)); sun.target.position.copy(tg);
  lids(t);
  fixed($('hook'), t < T_PEGA - .1 ? pop(t - .02, .3) * (1 - clamp((t - T_PEGA + .25) / .15)) : 0);
  const tg2 = [$('t1'), $('t2')]; tg2.forEach(e => e.style.opacity = 0);
  const tag = (el, txt, cls, on, x, y, t0, rot = -4) => { if (!on) return; el.textContent = txt; el.className = 'o tag ' + cls; place(el, true, x, y, pop(t - t0, .3), rot); };
  tag(tg2[0], '📄 BOLINHA DE PAPEL', 'white small', win(t, T_PAPEL, T_ERVILHA), 540, 420, T_PAPEL, -3);
  tag(tg2[0], '🟢 ERVILHA', 'green', win(t, T_ERVILHA, T_CANETA), 540, 420, T_ERVILHA, 3);
  tag(tg2[0], '🖊️ PONTA DA CANETA', 'blue small', win(t, T_CANETA, T_AGORA - .1), 540, 420, T_CANETA, -3);
  tag(tg2[0], '🤞 MÉDIO POR CIMA DO INDICADOR', 'white small', win(t, T_CRUZA, T_FECHA - .1), 540, 380, T_CRUZA, -2);
  tag(tg2[0], '😌 OLHOS FECHADOS', 'purple', win(t, T_FECHA + .7, T_ROLA), 540, 380, T_FECHA + .7, -3);
  tag(tg2[0], '🔄 ROLA DEVAGAR', '', win(t, T_ROLA, T_PRESTA - .1), 540, 380, T_ROLA, 3);
  tag(tg2[0], '🤔 QUANTAS BOLINHAS?', 'white', win(t, T_QUANTAS, T_SE), 540, 380, T_QUANTAS, -3);
  tag(tg2[0], '😵 SENTIU DUAS?', 'red', win(t, T_DUAS - .1, T_ISSO - .1), 540, 380, T_DUAS - .1, 3);
  tag(tg2[0], '🏛️ ILUSÃO DE ARISTÓTELES', 'white small', win(t, T_ARIST - .1, T_FUNC - .1), 540, 330, T_ARIST - .1, -3);
  tag(tg2[1], '📜 +2.300 ANOS', '', win(t, T_DOIS - .1, T_FUNC - .1), 540, 440, T_DOIS - .1, 3);
  tag(tg2[0], '🔴 LADOS DE FORA', 'red', win(t, T_FORA - .1, T_NUNCA), 540, 380, T_FORA - .1, -3);
  tag(tg2[0], '🚫 NUNCA NO MESMO OBJETO', 'white small', win(t, T_NUNCA, T_SO - .1), 540, 380, T_NUNCA, 3);
  tag(tg2[0], '🎯 CRUZADOS: TOCA OS DOIS', 'green small', win(t, T_TOCA - .1, T_O - .1), 540, 380, T_TOCA - .1, -3);
  tag(tg2[0], '🧠 NÃO ATUALIZA A POSIÇÃO', 'white small', win(t, T_ATUAL - .1, T_MAPA - .1), 540, 380, T_ATUAL - .1, 3);

  let mk = null; if (win(t, T_VIRA, T_AGORA2 - .1)) mk = ['1 → 2', T_VIRA];
  if (mk) { $('mark').textContent = mk[0]; place($('mark'), true, 540, 470, pop(t - mk[1], .3) * .6, -3); } else $('mark').style.opacity = 0;
  fixed($('final'), t >= T_SEU3 - .1 ? pop(t - T_SEU3 + .1, .35) : 0);

  const cap2 = $('cap'); const capOff = t < T_PEGA - .1 || t >= T_SEU3 - .1;
