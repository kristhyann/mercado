  // 1 leitor de cartão

  // 3 teclado criptografado
  [S(3), (t, k) => { explode(1, .4, 1); keys.forEach((kk, i) => { const pr = Math.sin((t - T_SENHA) * 6 - i) > .92 && t > T_SENHA ? 1 : 0; kk.position.z = -pr * .008; });
    return [V(.1, 1.35, 1.35), V(-.05, 1.06, 1.03)]; }],
  // 4 comunicação com o banco
  [S(4), (t, k) => { lobby.visible = false; atm.visible = false; bankS.visible = true; skyU.top.value.set(0x9EC8EA); skyU.bot.value.set(0xEAF4FC);

    return [bankS.position.clone().add(V(1.4, 2.0, 5.6 - k * .05)), bankS.position.clone().add(V(0, 1.0, -.3))]; }],
  // 5 cofre e cassetes
  [S(5), (t, k) => { explode(1, ease(clamp((t - T_COFRE + .3) / 1)) * .6 + .4, 1); cassettes.forEach((c, i) => { const s = clamp((t - T_CASS - i * .2) / .5); c.position.z = -.02 + ease(s) * .18 * Math.sin(s * Math.PI); });
    return [V(1.1, .85, 2.1 - k * .03), V(0, .45, 0)]; }],
  // 6 rolos e sensores
  [S(6), (t, k) => { explode(1, 1, 1); rollers.forEach(r => r.rotation.x = t * 12); beltRollers.forEach(r => r.rotation.x = t * 12);
    flyNotes.forEach((n, i) => { const u = ((t - T_ROLOS) * .35 - i * .18); n.visible = t > T_ROLOS && u > 0 && u < .55; n.position.copy(notePos(u)); n.lookAt(notePos(u + .01)); n.rotateX(Math.PI / 2); });
    const pass = flyNotes.some((n, i) => { const u = ((t - T_ROLOS) * .35 - i * .18); return u > .2 && u < .28; }); beamS.material.color.set(pass && t > T_SENS - .3 ? 0x22FF66 : 0xFF3030);
    return t < T_SENS - .2 ? [V(.55, 1.15, .45), V(0, .72, -.25)] : [V(.45, 1.05, .2), V(0, .84, -.28)]; }],
  // 7 duas notas grudadas -> rejeição
  [S(7), (t, k) => { explode(1, 1, 1); rollers.forEach(r => r.rotation.x = t * 12); const u = clamp((t - T_DUAS) / 2.2);
    dblNotes.forEach((n, i) => { n.visible = true; let p; if (u < .45) p = notePos(u * .62, i * .003); else { const v = (u - .45) / .55; const a = notePos(.28), b = rejectBin.position.clone().add(V(0, .06, 0)); p = a.clone().lerp(b, ease(v)); p.y += Math.sin(v * Math.PI) * .08 + i * .003; } n.position.copy(p); n.rotation.set(0, 0, 0); });

];
window.draw = function (t) {

  { const el = $('list'); const on = t > T_LEITF - .1 && t < T_NUNCA - .2; el.style.opacity = on ? 1 : 0; el.style.transform = `scale(${on ? pop(t - T_LEITF + .1, .35) : .001})`; [...el.children].forEach((c, j) => c.style.opacity = t > T_LEITF + j * .7 ? 1 : 0); }
