  car.visible = win(t, S(13) - .4, S(14) + .6); car.scale.setScalar(Math.max(.001, pop(t - S(13) + .4, .35))); car.position.y = Math.abs(Math.sin(t * 20)) * .01;
  // mitos
  heart.visible = win(t, T_CORACAO - .2, S(15)); if (heart.visible) { heart.position.copy(tmp).add(V(.35, -.5, .2)); heart.scale.setScalar((1 + .15 * Math.max(0, Math.sin(t * 7))) * Math.max(.001, pop(t - T_CORACAO + .2, .3))); heart.lookAt(cam.position); }
  eyeBig.visible = win(t, T_OLHO - .2, S(15)); if (eyeBig.visible) { eyeBig.position.copy(tmp).add(V(-.35, .15, .2)); eyeBig.scale.setScalar(Math.max(.001, pop(t - T_OLHO + .2, .3)) * 1.2); eyeBig.lookAt(cam.position); }
  // germes da mão → celular e maçaneta
  per.armR.hand.getWorldPosition(tmp2);
  germs.forEach((g, i) => { const on = win(t, T_MAO, S(17)); g.visible = on; if (!on) return; let p = tmp2.clone().add(V(Math.sin(i * 2) * .06, Math.cos(i * 3) * .06, .03)); if (t > T_GERMES && i >= 5) { const u = clamp((t - T_GERMES - (i % 5) * .1) / .6); const tgt = i < 10 ? V(.55 + Math.sin(i) * .05, .93, .4 + Math.cos(i) * .08) : V(-.55 + Math.sin(i) * .04, 1.0 + Math.cos(i) * .04, .35); p.lerp(tgt, ease(u)); } g.position.copy(p); g.scale.setScalar(1 + .2 * Math.sin(t * 8 + i)); });
  phone.visible = knob.visible = table.visible = win(t, S(16) - .3, S(17) + .4);
  tissue.visible = win(t, T_LENCO, S(16)); if (tissue.visible) { per.armL.hand.getWorldPosition(tissue.position); tissue.lookAt(cam.position); }

  // ---------- textos ----------
  fixed($('hook'), t < S(1) ? pop(t - .05, .35) * (1 - clamp((t - S(1) + .2) / .2)) : 0);
  const lb = [...LBL].reverse().find(l => t >= l[0]); const lbOn = lb && t < S(12) && !win(t, S(7), S(10));
  if (lbOn) { $('label').firstElementChild.textContent = lb[1]; fixed($('label'), pop(t - lb[0], .3)); } else fixed($('label'), 0);
  const t1 = $('t1'), t2 = $('t2'); t1.style.opacity = 0; t2.style.opacity = 0;
  const tag = (el, txt, cls, on, x, y, t0, rot = -4) => { if (!on) return; el.textContent = txt; el.className = 'o tag ' + cls; place(el, true, x, y, pop(t - t0, .3), rot); };
  tag(t1, 'PODE SER PERIGOSO', 'red', win(t, T_PERIGO - .2, S(2)), 540, 600, T_PERIGO - .2, -3);
  tag(t1, 'IRRITA OS NERVOS', '', win(t, T_POEIRA + .5, S(4)), 540, 600, T_POEIRA + .5, -4);
  tag(t1, 'PUXA O AR · FECHA A GARGANTA', 'blue', win(t, T_PUXA, T_ABRE), 540, 600, T_PUXA, -3);
  tag(t1, 'ATÉ 8 METROS', 'red', win(t, T_OITO, S(8)), 540, 600, T_OITO, -4);
  tag(t1, 'PRESSÃO SOBE', 'red', win(t, T_PRESSAO, T_OUVIDO), 540, 600, T_PRESSAO, -4);
  tag(t1, 'PODE MACHUCAR O TÍMPANO', 'red', win(t, T_TIMP - .3, S(11)), 540, 600, T_TIMP - .3, -3);
  tag(t1, 'CASOS RAROS', '', win(t, S(11), S(12)), 540, 600, S(11), -4);
  tag(t1, 'INGLATERRA · 2018', 'blue', win(t, T_ING, S(13)), 540, 600, T_ING, -4);
  tag(t2, '1 SEMANA INTERNADO', 'red', win(t, T_ING + 1.2, S(13)), 540, 720, T_ING + 1.2, 3);
  tag(t1, 'ESCÓCIA · 2023', 'blue', win(t, T_ESC, S(14)), 540, 600, T_ESC, -4);

  tag(t1, 'OLHO SALTA? MITO', 'green', win(t, T_OLHO, T_CORACAO), 540, 600, T_OLHO, -3);

  place($('xmark'), win(t, T_TAMPAR, S(9)) || win(t, T_GERMES, S(17)), 800, 780, 1, -8);
  const cm = $('comic');
  if (win(t, 1.2, S(1) + .5)) { cm.textContent = 'ATCH...'; cm.style.fontSize = '130px'; place(cm, true, 540, 840, pop(t - 1.2, .25), -4); }
  else if (win(t, T_EXPULSA, T_EXPULSA + 1.0)) { cm.textContent = 'EXPULSA!'; cm.style.fontSize = '130px'; place(cm, true, 540, 820, pop(t - T_EXPULSA, .25), -6); }

  const cap = $('cap');

  renderer.render(scene, cam); return 1;
