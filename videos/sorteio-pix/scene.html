window.draw = function (t) {
  let i = 0; while (i + 1 < SHOTS.length && SHOTS[i + 1][0] <= t) i++;

  const tg2 = [$('t1'), $('t2')]; tg2.forEach(e => e.style.opacity = 0);

  tag(tg2[0], '1️⃣ SEGUE A PÁGINA', 'blue', win(t, T_PRIM, T_SEG2 - .1), 540, 300, T_PRIM, -3);

  tag(tg2[0], '3️⃣ COMENTA "EU QUERO"', '', win(t, T_TERC, T_MARCA), 540, 300, T_TERC, -3);
  tag(tg2[0], '🏷️ + MARCA UM AMIGO', 'white', win(t, T_MARCA, T_PRONTO - .1), 540, 300, T_MARCA, 3);
  tag(tg2[0], '✅ VOCÊ JÁ TÁ CONCORRENDO', 'green small', win(t, T_CONC - .1, T_EOLHA - .1), 540, 300, T_CONC - .1, -3);
  tag(tg2[0], '🚫 NÃO PRECISA PAGAR NADA', 'white small', win(t, T_NADA - .3, T_O - .1), 540, 1220, T_NADA - .3, 3);
  tag(tg2[0], '📢 GANHADOR ANUNCIADO AQUI', 'purple small', win(t, T_GANH - .1, T_ENTAO - .1), 540, 300, T_GANH - .1, -3);
  tag(tg2[0], '🏷️ MARCA AQUELE AMIGO', '', win(t, T_MARCA2 - .1, T_BOA - .1), 540, 330, T_MARCA2 - .1, -3);
  const big = $('big'); if (win(t, .3, T_E - .1)) { big.textContent = ''; big.style.opacity = 0; } else big.style.opacity = 0;
  fixed($('final'), t >= T_BOA - .1 ? pop(t - T_BOA + .1, .35) : 0);
  $('wm').style.opacity = .85;
  let wTxt = null, wSt = 0;
  for (const w2 of ALL) if (t >= w2.start - .03 && t < w2.end + .2) { wTxt = w2.w; wSt = w2.start; }
  const cap2 = $('cap'); const capOff = t < T_E - .1 || t >= T_BOA - .1;

  renderer.render(scene, cam); return 1;
