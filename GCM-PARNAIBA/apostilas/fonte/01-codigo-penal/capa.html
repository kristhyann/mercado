<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>Capa</title>
<!-- Capa-modelo das apostilas. Os marcadores {{...}} são preenchidos pelo build.js a partir do config.json.
     Não usar brasão, logotipo ou símbolos oficiais da Prefeitura, da Guarda ou da banca. -->
<style>
@page{ size:A4; margin:0; }
html,body{ margin:0; width:210mm; height:297mm; overflow:hidden; font-family:"Inter",sans-serif; -webkit-print-color-adjust:exact; print-color-adjust:exact; }
.c{ position:relative; width:210mm; height:297mm; background:#0f1f3d; color:#fff; overflow:hidden; }
.dots{ position:absolute; inset:0; background-image:radial-gradient(rgba(255,255,255,.07) 1.2px, transparent 1.3px); background-size:7mm 7mm; }
.glow{ position:absolute; width:190mm; height:190mm; right:-70mm; top:-60mm; border-radius:50%; background:radial-gradient(circle, rgba(232,185,35,.20), rgba(232,185,35,0) 65%); }
.band{ position:absolute; right:0; top:0; bottom:0; width:14mm; background:#e8b923; }
.band span{ position:absolute; left:50%; top:50%; transform:translate(-50%,-50%) rotate(90deg); white-space:nowrap; font-weight:900; letter-spacing:4pt; font-size:9.5pt; color:#0f1f3d; }
.top{ position:absolute; left:16mm; right:26mm; top:18mm; display:flex; justify-content:space-between; align-items:center; }
.brand{ font-weight:900; letter-spacing:3pt; font-size:10.5pt; } .brand b{ color:#e8b923; }
.ed{ border:1.5px solid rgba(255,255,255,.5); border-radius:20pt; padding:3pt 10pt; font-size:8.5pt; letter-spacing:1.5pt; }
.title{ position:absolute; left:16mm; right:26mm; top:40mm; }
.num{ display:inline-flex; align-items:center; gap:8pt; background:#fff; color:#0f1f3d; font-weight:900; font-size:12pt; letter-spacing:2.5pt; padding:5pt 12pt; border-radius:4pt; }
.num i{ font-style:normal; background:#e8b923; color:#0f1f3d; padding:0 6pt; border-radius:3pt; }
h1{ font-family:"Inter Display","Inter"; font-weight:900; font-size:52pt; line-height:.92; margin:12pt 0 0; letter-spacing:-1pt; }
h1 em{ font-style:normal; color:#e8b923; }
.sub{ margin-top:12pt; font-size:18pt; font-weight:800; line-height:1.18; color:#fff; border-left:5px solid #e8b923; padding-left:12pt; }
.ill{ position:absolute; left:16mm; right:26mm; top:136mm; }
.bottom{ position:absolute; left:16mm; right:26mm; bottom:18mm; }
.tag{ font-size:12.5pt; line-height:1.4; color:#dfe6f2; }
.chips{ margin-top:12pt; display:flex; gap:7pt; flex-wrap:wrap; }
.chips span{ font-size:8.5pt; font-weight:800; letter-spacing:.8pt; border:1.5px solid rgba(255,255,255,.35); border-radius:20pt; padding:3pt 10pt; color:#dfe6f2; }
.aviso{ margin-top:10pt; font-size:8.5pt; color:#0f1f3d; background:#e8b923; display:inline-block; padding:3pt 9pt; border-radius:4pt; font-weight:800; }
.foot{ margin-top:10pt; font-size:8.5pt; color:#9fb0cc; display:flex; justify-content:space-between; }
</style></head>
<body><div class="c">
  <div class="dots"></div><div class="glow"></div>
  <div class="band"><span>PREPARAÇÃO GCM PARNAÍBA · DO ZERO À APROVAÇÃO</span></div>
  <div class="top"><div class="brand">PROFESSOR <b>GCM PARNAÍBA</b></div><div class="ed">MATERIAL DE ESTUDO</div></div>
  <div class="title">
    <div class="num">APOSTILA <i>{{NUMERO}}</i> · GUARDA MUNICIPAL</div>
    <h1>{{TITULO1}}<br><em>{{TITULO2}}</em></h1>
    <div class="sub">{{SUB}}</div>
  </div>
  <svg class="ill" viewBox="0 0 560 250" xmlns="http://www.w3.org/2000/svg" font-family="Inter">
    <ellipse cx="280" cy="240" rx="240" ry="8" fill="#000" opacity=".3"/>
    <rect x="40" y="185" width="230" height="38" rx="6" fill="#1f4e8c"/><rect x="40" y="185" width="15" height="38" fill="#e8b923"/>
    <rect x="58" y="147" width="210" height="38" rx="6" fill="#eef2f8"/><rect x="58" y="147" width="15" height="38" fill="#0f1f3d"/>
    <rect x="48" y="109" width="200" height="38" rx="6" fill="#e8b923"/><rect x="48" y="109" width="15" height="38" fill="#0f1f3d"/>
    <path d="M400 20 L480 48 V108 C480 160 444 192 400 208 C356 192 320 160 320 108 V48 Z" fill="#1f4e8c" stroke="#e8b923" stroke-width="5"/>
    <path d="M370 112 l20 20 l42 -46" fill="none" stroke="#e8b923" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <g transform="translate(500,150)"><circle r="30" fill="none" stroke="#9fb0cc" stroke-width="3"/><circle r="18" fill="none" stroke="#9fb0cc" stroke-width="3"/><circle r="6" fill="#e8b923"/></g>
  </svg>
  <div class="bottom">
    <div class="tag">{{DESCRICAO}}</div>
    <div class="chips">{{CHIPS}}</div>
    <div class="aviso">{{AVISO}}</div>
    <div class="foot"><span>Material pesquisado e atualizado em {{DATA}}</span><span>Questões autorais · Sem vínculo oficial</span></div>
  </div>
</div></body></html>
