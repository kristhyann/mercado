<style>
@font-face{font-family:P;font-weight:800;src:url(/_kit/node_modules/@fontsource/poppins/files/poppins-latin-800-normal.woff2)}
@font-face{font-family:P;font-weight:900;src:url(/_kit/node_modules/@fontsource/poppins/files/poppins-latin-900-normal.woff2)}
:root{--cor:#FF8A1F}  /* ► cor de destaque do vídeo */
html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:#000;font-family:P,sans-serif}
canvas{position:absolute;left:0;top:0}
.o{position:absolute;left:0;top:0;transform-origin:50% 50%;opacity:0}
.stroke{color:#fff;-webkit-text-stroke:14px #111;paint-order:stroke fill;text-shadow:0 8px 0 rgba(0,0,0,.35)}
#hook{width:1080px;top:200px;text-align:center;font-weight:900;font-size:96px;line-height:1.02}
#hook b{color:var(--cor);display:block;font-size:140px}
#label{width:1080px;top:180px;text-align:center}
#label span{display:inline-block;font-weight:900;font-size:96px;color:var(--cor);-webkit-text-stroke:14px #111;paint-order:stroke fill;text-shadow:0 8px 0 rgba(0,0,0,.35);line-height:1.02}
#cap{width:1080px;top:1300px;text-align:center;font-weight:900;font-size:116px}
#cap.hl{color:var(--cor)}
.tag{background:#FFD21F;color:#111;font-weight:900;font-size:60px;padding:8px 30px;border-radius:22px;border:7px solid #111;box-shadow:0 8px 0 #111;white-space:nowrap}
.tag.red{background:#FF4D6D;color:#fff}.tag.green{background:#22C55E;color:#fff}.tag.blue{background:#3B82F6;color:#fff}.tag.white{background:#fff;color:#111}
.bub{background:#fff;color:#111;font-weight:900;font-size:58px;padding:16px 34px;border-radius:40px;border:8px solid #111;box-shadow:0 10px 0 #111;white-space:nowrap;text-align:center;line-height:1.05}
.comic{font-weight:900;font-size:150px;color:#FFD21F;-webkit-text-stroke:16px #111;paint-order:stroke fill;text-shadow:0 10px 0 rgba(0,0,0,.3);white-space:nowrap}
#xmark{font-weight:900;font-size:280px;color:#FF2D2D;-webkit-text-stroke:12px #fff;paint-order:stroke fill;line-height:1}
#final{left:60px;width:960px;top:1330px;text-align:center}
#final span{display:block;background:#fff;color:#111;font-weight:900;font-size:76px;line-height:1.05;padding:30px;border:9px solid #111;border-radius:40px;box-shadow:0 14px 0 #111}
#final em{font-style:normal;color:var(--cor)}
#wm{left:40px;top:70px;font-weight:900;font-size:40px;color:#fff;opacity:.85;-webkit-text-stroke:6px rgba(0,0,0,.55);paint-order:stroke fill}
</style></head><body>
<div id="hook" class="o stroke">PRA ONDE<b>VAI TUDO?</b></div>               <!-- ► gancho: 2 a 6 palavras -->
<div id="label" class="o"><span>X</span></div>
<div id="t1" class="o tag"></div>
<div id="b1" class="o bub"></div>
<div id="xmark" class="o">✕</div>
<div id="comic" class="o comic"></div>
<div id="cap" class="o stroke"></div>
<div id="final" class="o"><span>Segue a página,<br><em>e ... (piada curta).</em></span></div>   <!-- ► cartão final -->
<div id="wm" class="o">@SUA_MARCA</div>                                   <!-- ► marca d'água (obrigatória) -->
<script type="importmap">{"imports":{"three":"/_kit/node_modules/three/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';
import { clamp, lerp, ease, easeOut, pop, M, mesh, rnd, rr } from '/_kit/kit.js';
// import { buildPerson, PP, poseP, face, mixP } from '/_kit/pessoas.js';   // pessoas low-poly
// import { buildMonkey, POSES, applyPose, mixPose } from '/_kit/kit.js';    // macaco mascote

await document.fonts.load('900 60px P');
const TP = await (await fetch('tempos.json?' + Date.now())).json();
const SN = TP.sentences; const S = i => SN[i].start, E = i => SN[i].end; window.DURATION = TP.duration;
const WD = (i, re, n = 0) => { const ws = SN[i].words.filter(w => re.test(w.w)); return ws[n] ? ws[n].start : S(i); };   // tempo da palavra
const W = 1080, H = 1920;
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(window.devicePixelRatio || 1); renderer.setSize(W, H); renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace; renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.08;
document.body.prepend(renderer.domElement);
const scene = new THREE.Scene(); const cam = new THREE.PerspectiveCamera(38, W / H, .05, 600);
const V = (x, y, z) => new THREE.Vector3(x, y, z);
const grp = (par = scene) => { const g = new THREE.Group(); par.add(g); return g; };
const box = (w, h, d, c, x, y, z, par = scene) => { const m = mesh(new THREE.BoxGeometry(w, h, d), typeof c === 'number' ? M(c) : c, x, y, z, par); m.castShadow = true; m.receiveShadow = true; return m; };
const C = h => new THREE.Color(h);

// ---------- céu, luz, chão (troque as cores conforme o tema) ----------
const skyU = { top: { value: C(0x4FA8E8) }, bot: { value: C(0xCFEFFF) } };
scene.add(new THREE.Mesh(new THREE.SphereGeometry(500, 24, 16), new THREE.ShaderMaterial({ side: THREE.BackSide, depthWrite: false, fog: false, uniforms: skyU,
  vertexShader: 'varying vec3 vP; void main(){ vP = position; gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.); }',
  fragmentShader: 'uniform vec3 top; uniform vec3 bot; varying vec3 vP; void main(){ float h = clamp(normalize(vP).y*2.2+.1,0.,1.); gl_FragColor = vec4(mix(bot,top,pow(h,.8)),1.); }' })));
const sun = new THREE.DirectionalLight(0xFFF2D6, 2.5); sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048);
{ const sc = sun.shadow.camera; sc.left = -12; sc.right = 12; sc.top = 12; sc.bottom = -12; sc.far = 80; } sun.shadow.bias = -.0005; scene.add(sun); scene.add(sun.target);
scene.add(new THREE.HemisphereLight(0xEAF6FF, 0x8E7A6A, 1.2));
{ const g = mesh(new THREE.CylinderGeometry(6, 6, .2, 48), M(0xF1E6D2), 0, -.1, 0, scene); g.receiveShadow = true; }

// ---------- ► tempos das palavras-chave (uma constante por peça / momento) ----------
const T_PECA1 = WD(2, /peça|caixa/i);          // exemplo: troque pelos nomes do seu roteiro

// ---------- ► objeto do tema (montado peça por peça) ----------
const obj = grp();
const peca1 = box(1.2, 1.2, 1.2, 0xFF8A1F, 0, .6, 0, obj);    // exemplo

// ---------- utilidades de texto ----------
const $ = id => document.getElementById(id);
function place(el, on, x, y, s = 1, rot = 0) { el.style.opacity = on && s > 0 ? 1 : 0; if (!on) return; el.style.transform = `translate(${x - el.offsetWidth / 2}px,${y - el.offsetHeight / 2}px) scale(${s}) rotate(${rot}deg)`; }
function fixed(el, s) { el.style.opacity = s > 0 ? 1 : 0; el.style.transform = `scale(${Math.max(s, .001)})`; }
const win = (t, a, b) => t >= a && t < b;
const EV = []; const ev = (t, type) => EV.push({ t: +t.toFixed(3), type });   // sons: pop whoosh ding win buzz buzzx crack zap gulp boing mosq clang puf
[[.05, 'whoosh'], [T_PECA1, 'pop']].forEach(([t, k]) => ev(t, k));             // ►
const LBL = [[T_PECA1, 'NOME DA PEÇA']];                                       // ► etiqueta do topo: nome da peça atual ('' apaga)
const HL = /peça|caixa/i;                                                       // ► palavras da legenda em destaque

// ---------- ► planos: um por frase (corte seco), câmera andando devagar dentro do plano ----------
// cada plano devolve [posição da câmera, para onde olha]. ZK afasta a câmera (vídeo vertical precisa de câmera mais longe).
const SHOTS = [
  [0, (t, k) => { peca1.scale.setScalar(Math.max(.001, pop(t - T_PECA1, .35))); return [V(2.4, 2.2, 4.6 - k * .1), V(0, .8, 0)]; }],
  [S(1), (t, k) => { return [V(-2.6, 1.8, 4.2), V(0, .8, 0)]; }],
];
const ZK = 1.6;

window.draw = function (t) {
  let i = 0; while (i + 1 < SHOTS.length && SHOTS[i + 1][0] <= t) i++;
  const [p0, tg] = SHOTS[i][1](t, t - SHOTS[i][0]); const p = tg.clone().add(p0.clone().sub(tg).multiplyScalar(ZK));
  p.x += Math.sin(t * .35) * .05; p.y += Math.sin(t * .27) * .03;
  cam.position.copy(p); cam.lookAt(tg); cam.updateProjectionMatrix(); cam.updateMatrixWorld(true);
  sun.position.copy(tg).add(V(5, 10, 7)); sun.target.position.copy(tg);

  // gancho (some quando começa a 2ª frase)
  fixed($('hook'), t < S(1) ? pop(t - .02, .3) * (1 - clamp((t - S(1) + .15) / .15)) : 0);
  // etiqueta do topo
  const lb = [...LBL].reverse().find(l => t >= l[0]);
  if (lb && lb[1]) { $('label').firstElementChild.innerHTML = lb[1]; fixed($('label'), pop(t - lb[0], .3)); } else fixed($('label'), 0);
  // tags e balões (um de cada vez, perto de y=600, nunca em cima do objeto nem da legenda)
  const t1 = $('t1'); t1.style.opacity = 0; const b1 = $('b1'); b1.style.opacity = 0;
  const tag = (txt, cls, on, x, y, t0, rot = -4) => { if (!on) return; t1.textContent = txt; t1.className = 'o tag ' + cls; place(t1, true, x, y, pop(t - t0, .3), rot); };
  const bub = (html, on, x, y, t0, rot = -2) => { if (!on) return; b1.innerHTML = html; place(b1, true, x, y, pop(t - t0, .3), rot); };
  // ► exemplo: tag('MOLHA TUDO', 'red', win(t, T_X, S(4)), 540, 600, T_X);
  place($('xmark'), false, 820, 800, 1, -8);                                // ► X vermelho em cada "Mas..."
  const cm = $('comic'); cm.style.opacity = 0;                               // ► onomatopeia (GLUP!, PARABÉNS!)
  fixed($('final'), t >= S(SN.length - 1) ? pop(t - S(SN.length - 1), .35) : 0);
  $('wm').style.opacity = .85;
  // legenda palavra por palavra
  let wTxt = null, wSt = 0;
  for (let i = 0; i < SN.length; i++) for (const w2 of SN[i].words) if (t >= w2.start - .03 && t < w2.end + .2) { wTxt = w2.w; wSt = w2.start; }
  const cap = $('cap');
  if (wTxt && t > S(1) - .05) { cap.textContent = wTxt.toUpperCase().replace(/[.,!?:;]/g, ''); cap.className = 'o stroke' + (HL.test(wTxt) ? ' hl' : ''); const k = t - wSt; fixed(cap, k < .06 ? lerp(.75, 1.1, clamp(k / .06)) : k < .12 ? lerp(1.1, 1, (k - .06) / .06) : 1); } else fixed(cap, 0);
  renderer.render(scene, cam); return 1;
};
window.EVENTS = EV;
window.ready = true;
</script></body></html>
